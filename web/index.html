<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPI Tides &amp; Wind</title>
<link rel="manifest" href="tides-manifest.json">
<link rel="icon" href="tides-icon-192.png">
<link rel="apple-touch-icon" href="tides-icon-192.png">
<meta name="theme-color" content="#0f1420">
<style>
  :root { --bg: #0f1420; --btn: #29334a; --btntext: #fff; --on: #4ade80; --gray: #99adc7; --red: #f76659; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden;
               font-family: system-ui, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  canvas { flex: 1; width: 100%; min-height: 0; display: block; }
  #bar { display: flex; gap: 10px; padding: 8px 16px 12px; align-items: center; }
  button { font: inherit; font-size: 18px; padding: 10px 18px; border: 0; border-radius: 8px;
           background: var(--btn); color: var(--btntext); cursor: pointer; }
  button.on { background: var(--on); color: #fff; }
  #upd { flex: 1; text-align: center; font-size: 17px; color: var(--gray); white-space: nowrap;
         overflow: hidden; text-overflow: ellipsis; }
  #upd.old { color: var(--red); }
  #gear { padding: 8px 12px; display: flex; align-items: center; }
  #gear svg { width: 26px; height: 26px; }

  /* settings window */
  #settings { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex;
              align-items: center; justify-content: center; }
  #settings[hidden] { display: none; }
  .panel { background: var(--bg); color: var(--btntext); border: 1px solid var(--btn); border-radius: 14px;
           padding: 18px 24px 22px; width: min(460px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
           overflow-y: auto; box-sizing: border-box; box-shadow: 0 10px 40px rgba(0,0,0,.4); font-size: 20px; }
  .panel h2 { margin: 0 0 8px; font-size: 24px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px;
         padding: 12px 0; border-bottom: 1px solid var(--btn); cursor: pointer; }
  .row small { display: block; font-size: 15px; color: var(--gray); }
  .sw { appearance: none; -webkit-appearance: none; width: 54px; height: 30px; border-radius: 15px; margin: 0;
        background: var(--btn); position: relative; cursor: pointer; flex: none; transition: background .15s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
               border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .sw:checked { background: var(--on); }
  .sw:checked::after { left: 27px; }
  .seg { display: flex; gap: 6px; }
  .seg button { font-size: 17px; padding: 8px 12px; }
  #done { width: 100%; margin-top: 18px; font-size: 20px; padding: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <button id="past">Past 24h</button>
  <span id="upd"></span>
  <button data-days="1">24 hours</button>
  <button data-days="3">3 days</button>
  <button data-days="5">5 days</button>
  <button data-days="10">10 days</button>
  <button id="gear" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</div>
<div id="settings" hidden>
  <div class="panel" role="dialog" aria-label="Settings">
    <h2>Settings</h2>
    <label class="row"><span>Light mode</span><input type="checkbox" class="sw" data-set="light"></label>
    <label class="row"><span>24-hour clock<small>Show 19:17 instead of 7:17p</small></span><input type="checkbox" class="sw" data-set="clock24"></label>
    <label class="row"><span>Weather icons<small>Sunny, cloudy, rain, storms...</small></span><input type="checkbox" class="sw" data-set="showWx"></label>
    <label class="row"><span>Moon phase</span><input type="checkbox" class="sw" data-set="showMoon"></label>
    <label class="row"><span>Show tides</span><input type="checkbox" class="sw" data-set="showTides"></label>
    <label class="row"><span>Show waves<small>Wave height, period and water temp</small></span><input type="checkbox" class="sw" data-set="showWaves"></label>
    <div class="row"><span>Text size</span>
      <div class="seg"><button data-size="s">Small</button><button data-size="m">Medium</button><button data-size="l">Large</button></div></div>
    <button id="done">Done</button>
  </div>
</div>
<script>
const PLACE = "South Padre Island, Texas";
const LAT = 26.07, LON = -97.17;          // wind and weather
const SEA_LAT = 26.07, SEA_LON = -97.05;  // a few miles offshore, for waves
const STATION = "8779770";                // NOAA Port Isabel
const KITE = 15;                          // bars turn green at this speed (mph)
const STALE_MIN = 35;                     // "Updated" turns red if older than this

const DARK = {
  bg: [.06,.08,.12,1], text: [1,1,1,1], gray: [.6,.68,.78,1], grid: [.2,.25,.32,1], sep: [.25,.3,.4,1],
  day: [.55,.7,.95,.16], night: [0,0,0,.45], past: [0,0,0,.3], gust: [1,1,1,.5], now: [1,1,1,.85],
  dot: [1,1,1,1], red: [.97,.4,.35,1], tide_fill: [.23,.55,.95,.3], tide: [.45,.72,1,1],
  wave_fill: [.2,.8,.75,.3], wave: [.35,.9,.85,1], period: [.95,.6,.95,1], rain: [.45,.72,1,1],
  water: [1,.62,.3,1],
  moon: [.96,.94,.82,1], moon_dark: [.22,.25,.32,1],
  light: [.4,.48,.6,1], breezy: [.98,.8,.3,1], kite: [.29,.87,.5,1], strong: [.97,.45,.3,1],
  btn: [.16,.2,.27,1], btntext: [1,1,1,1] };
const LIGHT = {
  bg: [.97,.97,.95,1], text: [.1,.12,.16,1], gray: [.38,.43,.5,1], grid: [.84,.86,.89,1], sep: [.68,.72,.78,1],
  day: [1,.9,.5,.3], night: [.25,.3,.45,.18], past: [1,1,1,.45], gust: [0,0,0,.45], now: [.1,.1,.1,.8],
  dot: [.1,.1,.1,1], red: [.85,.2,.15,1], tide_fill: [.2,.5,.9,.25], tide: [.1,.4,.8,1],
  wave_fill: [.1,.6,.55,.25], wave: [.05,.5,.45,1], period: [.6,.2,.6,1], rain: [.1,.4,.8,1],
  water: [.85,.4,.05,1],
  moon: [.98,.82,.3,1], moon_dark: [.3,.33,.4,1],
  light: [.55,.6,.68,1], breezy: [.9,.62,.05,1], kite: [.1,.65,.3,1], strong: [.88,.3,.15,1],
  btn: [.85,.87,.9,1], btntext: [.1,.12,.16,1] };

const WMO = {0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Cloudy",45:"Fog",48:"Fog",51:"Drizzle",
  53:"Drizzle",55:"Drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",80:"Showers",81:"Showers",
  82:"Heavy showers",95:"T-storms",96:"T-storms",99:"T-storms"};
const DIRS = "N NNE NE ENE E ESE SE SSE S SSW SW WSW W WNW NW NNW".split(" ");

// remembered settings
const SAVED = ["days", "past", "light", "clock24", "showTides", "showWaves", "showWx", "showMoon", "textSize"];
const state = { days: 3, past: false, light: false, clock24: false, showTides: true, showWaves: true, showWx: true, showMoon: true,
                textSize: "m", data: null, updated: null, error: "" };
try {
  const s = JSON.parse(localStorage.getItem("spi-tides") || "{}");
  for (const k of SAVED) if (k in s) state[k] = s[k];
} catch (e) {}
function save() {
  try { localStorage.setItem("spi-tides", JSON.stringify(Object.fromEntries(SAVED.map(k => [k, state[k]])))); } catch (e) {}
}
let T = state.light ? LIGHT : DARK;

// ---------- helpers ----------
const rgba = a => `rgba(${Math.round(a[0]*255)},${Math.round(a[1]*255)},${Math.round(a[2]*255)},${a[3] ?? 1})`;
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hourKey = d => `${isoDate(d)}T${pad(d.getHours())}:00`;
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
function parse(s) {  // "2026-11-06 21:17" or "2026-11-06T21:00", local time
  const m = s.match(/(\d+)-(\d+)-(\d+)[T ](\d+):(\d+)/);
  return new Date(+m[1], m[2]-1, +m[3], +m[4], +m[5]);
}
const h12 = d => d.getHours() % 12 || 12;
const ap = d => d.getHours() < 12 ? "a" : "p";
const hh24 = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const hm = d => state.clock24 ? hh24(d) : `${h12(d)}:${pad(d.getMinutes())} ${d.getHours() < 12 ? "AM" : "PM"}`;
const short = d => state.clock24 ? hh24(d) : `${h12(d)}:${pad(d.getMinutes())}${ap(d)}`;
const hourLbl = d => state.clock24 ? `${pad(d.getHours())}:00` : `${h12(d)}${ap(d)}`;
const compass = d => DIRS[Math.round(d / 22.5) % 16];
const windColor = s => s >= 25 ? T.strong : s >= KITE ? T.kite : s >= 10 ? T.breezy : T.light;
function moonAge(d) {  // 0 = new, 0.5 = full
  const ref = Date.UTC(2000, 0, 6, 18, 14), syn = 29.530589;
  const days = (midnight(d).getTime() + 18 * 3600e3 - ref) / 86400e3;
  return ((days % syn) + syn) % syn / syn;
}

// ---------- data ----------
async function getJSON(url, params) {
  const r = await fetch(url + "?" + new URLSearchParams(params));
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function load() {
  try {
    const noaa = "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter";
    const q = { product: "predictions", station: STATION, begin_date: ymd(new Date(Date.now() - 86400e3)),
      range: 312, datum: "MLLW", units: "english", time_zone: "lst_ldt", format: "json", application: "casey_app" };
    const [curve, hilo, w] = await Promise.all([
      getJSON(noaa, { ...q, interval: "30" }),
      getJSON(noaa, { ...q, interval: "hilo" }),
      getJSON("https://api.open-meteo.com/v1/forecast", {
        latitude: LAT, longitude: LON,
        hourly: "temperature_2m,wind_speed_10m,wind_gusts_10m,wind_direction_10m,is_day,precipitation_probability",
        daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",
        wind_speed_unit: "mph", temperature_unit: "fahrenheit", timezone: "America/Chicago",
        past_days: 1, forecast_days: 11 })]);
    const waves = new Map(), water = new Map();
    try {  // wave forecast only goes about 7 days out
      const r = await getJSON("https://marine-api.open-meteo.com/v1/marine", {
        latitude: SEA_LAT, longitude: SEA_LON, hourly: "wave_height,wave_period,sea_surface_temperature",
        timezone: "America/Chicago", past_days: 1, forecast_days: 8 });
      const m = r.hourly, inF = /F/.test((r.hourly_units || {}).sea_surface_temperature || "");
      m.time.forEach((t, i) => {
        const h = m.wave_height[i], p = m.wave_period[i], c = (m.sea_surface_temperature || [])[i];
        if (h != null && p != null) waves.set(t, [h * 3.281, p]);  // meters -> feet
        if (c != null) water.set(t, inF ? c : c * 9 / 5 + 32);     // Celsius -> Fahrenheit
      });
    } catch (e) {}
    state.data = {
      curve: curve.predictions.map(p => [parse(p.t), +p.v]),
      hilo: hilo.predictions.map(p => [parse(p.t), +p.v, p.type]),
      w, waves, water };
    state.updated = new Date();
    state.error = "";
  } catch (e) {
    state.error = `Update failed ${hm(new Date())}, retrying`;
    setTimeout(load, 120e3);
  }
  draw();
}

// ---------- drawing ----------
const cv = document.getElementById("c"), ctx = cv.getContext("2d");

function setFont(size, bold) { ctx.font = `${bold ? "bold " : ""}${size}px system-ui, Roboto, sans-serif`; }
function text(s, x, y, size, color, ax = .5, bold = false) {
  setFont(size, bold);
  ctx.fillStyle = rgba(color || T.text);
  ctx.textBaseline = "middle";
  const w = ctx.measureText(s).width;
  ctx.fillText(s, x - w * ax, y);
  return w;
}
function fit(s, size, maxW, bold) {  // largest font size (down to 70%) that fits in maxW
  setFont(size, bold);
  const w = ctx.measureText(s).width;
  return w <= maxW ? size : Math.max(size * .7, size * maxW / w);
}
function line(pts, color, width = 1, dash) {
  ctx.strokeStyle = rgba(color); ctx.lineWidth = width; ctx.setLineDash(dash || []);
  ctx.beginPath();
  for (let i = 0; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i+1]);
  ctx.stroke(); ctx.setLineDash([]);
}
function area(pts, base, color) {
  if (pts.length < 4) return;
  ctx.fillStyle = rgba(color);
  ctx.beginPath(); ctx.moveTo(pts[0], base);
  for (let i = 0; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i+1]);
  ctx.lineTo(pts[pts.length-2], base); ctx.closePath(); ctx.fill();
}
function rect(x, y, w, h, color) { ctx.fillStyle = rgba(color); ctx.fillRect(x, y, w, h); }
function dot(x, y, r, color) { ctx.fillStyle = rgba(color); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }

function arrow(cx, cy, deg, size, color) {
  const a = (deg + 180) * Math.PI / 180;  // direction the wind blows toward
  const dx = Math.sin(a), dy = -Math.cos(a);
  const x1 = cx + dx * size / 2, y1 = cy + dy * size / 2;
  ctx.strokeStyle = rgba(color); ctx.lineWidth = Math.max(1.5, size / 14); ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(cx - dx * size / 2, cy - dy * size / 2); ctx.lineTo(x1, y1);
  for (const s of [-1, 1]) {
    const b = a + Math.PI + s * .5;
    ctx.moveTo(x1, y1); ctx.lineTo(x1 + Math.sin(b) * size * .38, y1 - Math.cos(b) * size * .38);
  }
  ctx.stroke(); ctx.lineCap = "butt";
}

// ---------- weather icons (drawn, so they look the same on every device) ----------
function wxKind(code) {
  if (code >= 95) return "storm";
  if (code >= 80) return "showers";
  if (code >= 61) return "rain";
  if (code >= 51) return "drizzle";
  if (code >= 45) return "fog";
  return ["sun", "mostly", "partly", "cloud"][code] || "cloud";
}
function sun(cx, cy, r) {
  const c = rgba([.99, .78, .2, 1]);
  ctx.strokeStyle = c; ctx.lineWidth = Math.max(1.5, r * .22); ctx.lineCap = "round";
  ctx.beginPath();
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4;
    ctx.moveTo(cx + Math.cos(a) * r * 1.35, cy + Math.sin(a) * r * 1.35);
    ctx.lineTo(cx + Math.cos(a) * r * 1.8, cy + Math.sin(a) * r * 1.8);
  }
  ctx.stroke(); ctx.lineCap = "butt";
  ctx.fillStyle = c; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
}
function cloud(cx, cy, w, dark) {  // w = width; centred on cx, cy
  const h = w * .55, b = cy + h / 2;
  ctx.fillStyle = rgba(dark ? (state.light ? [.45,.5,.58,1] : [.62,.67,.75,1])
                            : (state.light ? [.7,.74,.8,1] : [.88,.9,.94,1]));
  ctx.beginPath();
  ctx.arc(cx - w * .24, b - h * .3, h * .3, 0, 7);
  ctx.arc(cx + w * .02, b - h * .52, h * .45, 0, 7);
  ctx.arc(cx + w * .25, b - h * .33, h * .33, 0, 7);
  ctx.fill();
  ctx.fillRect(cx - w * .24, b - h * .3, w * .49, h * .3);
}
function wxIcon(code, cx, cy, s) {  // s = icon height
  const k = wxKind(code);
  if (k === "sun") return sun(cx, cy, s * .27);
  if (k === "mostly") { sun(cx - s * .12, cy - s * .08, s * .24); return cloud(cx + s * .22, cy + s * .18, s * .62); }
  if (k === "partly") { sun(cx - s * .2, cy - s * .15, s * .22); return cloud(cx + s * .08, cy + s * .08, s * .95); }
  if (k === "showers") sun(cx - s * .28, cy - s * .25, s * .18);
  const wet = k !== "cloud" && k !== "fog";
  cloud(cx, wet ? cy - s * .14 : cy, s * 1.05, wet);
  const top = cy + s * .16;
  if (k === "fog") {
    line([cx - s * .45, cy + s * .32, cx + s * .45, cy + s * .32], T.gray, Math.max(1.5, s * .07));
    line([cx - s * .35, cy + s * .46, cx + s * .35, cy + s * .46], T.gray, Math.max(1.5, s * .07));
  } else if (k === "drizzle") {
    for (const dx of [-.25, 0, .25]) dot(cx + dx * s, top + s * .2, Math.max(1.3, s * .05), T.rain);
  } else if (k === "rain" || k === "showers") {
    ctx.lineCap = "round";
    for (const dx of [-.25, 0, .25]) line([cx + dx * s, top + s * .06, cx + dx * s - s * .08, top + s * .32], T.rain, Math.max(1.5, s * .08));
    ctx.lineCap = "butt";
  } else if (k === "storm") {
    ctx.fillStyle = rgba([.99, .78, .2, 1]); ctx.beginPath();
    for (const [x, y] of [[.06,0], [-.14,.24], [0,.24], [-.08,.42], [.16,.14], [.02,.14], [.1,0]]) ctx.lineTo(cx + x * s, top + y * s);
    ctx.closePath(); ctx.fill();
  }
}

// name of a day with its weather icon on the left and moon on the right, fitted to the column
function dayTitle(name, mid, y, size, maxW, d, code, iconS, moonR) {
  const ic = state.showWx && code != null ? iconS * 1.4 : 0, mn = state.showMoon ? moonR * 2 + size * .35 : 0;
  const ns = fit(name, size, maxW - ic - mn, true);
  setFont(ns, true);
  const nw = ctx.measureText(name).width, x0 = mid - (ic + nw + mn) / 2;
  if (ic) wxIcon(code, x0 + iconS * .65, y + iconS * .04, iconS);  // icon's art reaches ~.6 left of centre
  text(name, x0 + ic, y, ns, T.text, 0, true);
  if (mn) moon(x0 + ic + nw + size * .35 + moonR, y, moonR, moonAge(d));
}

function moon(cx, cy, r, age) {
  dot(cx, cy, r, T.moon_dark);
  const k = Math.cos(2 * Math.PI * age), side = age < .5 ? 1 : -1;  // lit on the right while waxing
  ctx.beginPath();
  for (let s = 0; s <= 24; s++) { const y = -r + 2*r*s/24; ctx.lineTo(cx + side * Math.sqrt(Math.max(r*r - y*y, 0)), cy + y); }
  for (let s = 24; s >= 0; s--) { const y = -r + 2*r*s/24; ctx.lineTo(cx + side * k * Math.sqrt(Math.max(r*r - y*y, 0)), cy + y); }
  ctx.closePath(); ctx.fillStyle = rgba(T.moon); ctx.fill();
}

function texasFlag(x, cy, h) {
  const w = h * 1.5, y = cy - h / 2;
  ctx.fillStyle = "#fff"; ctx.fillRect(x, y, w, h / 2);
  ctx.fillStyle = "#bf0a30"; ctx.fillRect(x, y + h / 2, w, h / 2);
  ctx.fillStyle = "#002868"; ctx.fillRect(x, y, w / 3, h);
  const sx = x + w / 6, r = h * .3;
  ctx.beginPath();
  for (let k = 0; k < 10; k++) {
    const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .4 : r;
    ctx.lineTo(sx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fillStyle = "#fff"; ctx.fill();
  if (state.light) { ctx.strokeStyle = rgba(T.sep); ctx.lineWidth = 1; ctx.strokeRect(x, y, w, h); }
}

const SCALE = { s: .88, m: 1, l: 1.14 };
function draw() {
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  rect(0, 0, W, H, T.bg);
  const f = Math.min(H / 46, W / 76) * (SCALE[state.textSize] || 1), now = new Date(), top = f * 2.1;
  const ps = fit(PLACE, f * 1.5, W * .3, true);
  const tw = text(PLACE, f * 1.2, top, ps, T.text, 0, true);
  texasFlag(f * 1.9 + tw, top, ps * .95);
  const placeEnd = f * 1.9 + tw + ps * 1.45;

  const old = !state.updated || now - state.updated > STALE_MIN * 60e3;
  const upd = document.getElementById("upd");
  upd.textContent = state.error || (state.updated ? `Updated ${hm(state.updated)}` : "Loading...");
  upd.classList.toggle("old", !!(old || state.error));
  if (state.data) chart(W, H, f, now, top, placeEnd);
}

function chart(W, H, f, now, top, placeEnd) {
  const { curve, hilo, w, waves, water } = state.data, hr = w.hourly, dy = w.daily;
  const times = hr.time.map(parse);
  const t0 = new Date(now); t0.setMinutes(0, 0, 0);
  const ts = state.past ? new Date(t0 - 24 * 3600e3) : t0;   // chart start
  const t1 = state.days === 1 ? new Date(+t0 + 24 * 3600e3) : addDays(t0, state.days + 1);
  const inow = hr.time.indexOf(hourKey(t0)), i0 = hr.time.indexOf(hourKey(ts));
  if (inow < 0 || i0 < 0) { text("Waiting for new data...", W / 2, H / 2, f, T.gray); return; }
  const n = Math.round((t1 - ts) / 3600e3);
  const idx = []; for (let k = 0; k < n && i0 + k < times.length; k++) idx.push(i0 + k);
  const spd = hr.wind_speed_10m, gst = hr.wind_gusts_10m, dirs = hr.wind_direction_10m;
  const rainP = hr.precipitation_probability;

  const L = f * 3.4, R = W - f * 3.2, pw = R - L, bw = pw / n, span = t1 - ts;
  const xt = t => L + (t - ts) / span * pw;
  const hourly = n <= 50;                           // 24 hour view: show every hour
  const step = n <= 30 ? 1 : n <= 50 ? 2 : n <= 100 ? 3 : n <= 170 ? 6 : 12;   // arrow spacing in hours

  // ---- current conditions in header ----
  const s0 = spd[inow], wc = windColor(s0);
  const mph = `${Math.round(s0)} mph`;
  let extra = `gusts ${Math.round(gst[inow])}   ${compass(dirs[inow])}   ${Math.round(hr.temperature_2m[inow])}°F`;
  const wv0 = waves.get(hr.time[inow]), wt0 = water.get(hr.time[inow]);
  if (wv0) extra += `   waves ${wv0[0].toFixed(1)} ft @ ${Math.round(wv0[1])}s`;
  if (wt0 != null) extra += `   water ${Math.round(wt0)}°F`;
  const mphW = (setFont(f * 2.3, true), ctx.measureText(mph).width);
  let es = f * 1.45;
  setFont(es); let ew = ctx.measureText(extra).width;
  const need = () => f * 3.6 + mphW + f * 1.2 + ew;
  let cx = Math.max(W * .36, placeEnd + f * 1.5);
  if (cx + need() > W - f * 1.2) cx = Math.max(placeEnd + f * 1.5, W - f * 1.2 - need());
  if (cx + need() > W - f * 1.2) { es = fit(extra, es, W - f * 1.2 - cx - f * 4.8 - mphW, false); setFont(es); ew = ctx.measureText(extra).width; }
  arrow(cx + f, top, dirs[inow], f * 1.9, wc);
  let x = cx + f * 2.4;
  x += text(mph, x, top, f * 2.3, wc, 0, true) + f * 1.2;
  text(extra, x, top, es, T.text, 0);

  // ---- vertical layout ----
  const fullCol = 86400e3 / span * pw;
  const mode = fullCol > pw * .18 ? "wide" : fullCol > pw * .07 ? "mid" : "narrow";
  const rh = f * 1.5, rows = mode === "wide" ? 3 : mode === "mid" ? 4 : 1;
  const h0 = state.showWx ? rh * 1.4 : rh;  // taller name row so weather icons don't touch the next line
  const dayTop = top + f * 2.2, dayBot = dayTop + h0 + (rows - 1) * rh;
  const rowY = r => r ? dayTop + h0 + rh * (r - .5) : dayTop + h0 / 2;
  const arrowY = dayBot + f * 1.1, pctY = arrowY + f * 1.35, tempY = pctY + f * 1.2;
  const pBot = H - f * 1.7, gap = f * 2.1;  // room for hour labels and panel titles
  const panels = [["wind", 1.3]];
  if (state.showTides) panels.push(["tide", 1]);
  if (state.showWaves) panels.push(["wave", 1]);
  let y = (hourly ? tempY : pctY) + f * .9;
  const totW = panels.reduce((a, p) => a + p[1], 0), avail = pBot - y - gap * panels.length;
  const box = {};
  for (const [name, wgt] of panels) { y += gap; box[name] = [y, y + avail * wgt / totW]; y = box[name][1]; }
  const [wt, wb] = box.wind;

  // day / night shading
  for (let k = 0; k < idx.length;) {
    const isDay = hr.is_day[idx[k]];
    let e = k; while (e < idx.length && hr.is_day[idx[e]] === isDay) e++;
    rect(L + k * bw, wt, (e - k) * bw, pBot - wt, isDay ? T.day : T.night);
    k = e;
  }

  // day columns with forecast and moon
  const today = midnight(now);
  for (let d = midnight(ts); d < t1; d = addDays(d, 1)) {
    const a = new Date(Math.max(ts, d)), b = new Date(Math.min(t1, addDays(d, 1)));
    const xa = xt(a), xb = xt(b), mid = (xa + xb) / 2, colw = xb - xa, cw = colw * .92;
    if (a > ts) line([xa, pBot, xa, dayTop - f * .3], T.sep, 1);
    const j = dy.time.indexOf(isoDate(d));
    if (j < 0) continue;
    const pp = dy.precipitation_probability_max[j] || 0;
    const cond = WMO[dy.weather_code[j]] || "";
    const temps = `${Math.round(dy.temperature_2m_max[j])}° / ${Math.round(dy.temperature_2m_min[j])}°`;
    let name;
    if (d < today) name = "Yesterday";
    else if (+d === +today) name = now.getHours() >= 17 && !state.past ? "Tonight" : "Today";
    else name = mode === "wide" ? d.toLocaleDateString("en-US", { weekday: "long" })
                                : `${d.toLocaleDateString("en-US", { weekday: "short" })} ${d.getDate()}`;
    const rain = `rain ${Math.round(pp)}%`;
    if (mode === "wide" && colw > pw * .12) {
      dayTitle(name, mid, rowY(0), f * 1.45, colw - f * 1.2, d, dy.weather_code[j], f * 1.8, f * .75);
      text(cond, mid, rowY(1), fit(cond, f * 1.2, cw), T.gray);
      const tr = `${temps}    ${rain}`;
      text(tr, mid, rowY(2), fit(tr, f * 1.2, cw));
    } else if (mode !== "narrow" && colw > fullCol * .55) {
      dayTitle(name, mid, rowY(0), f * 1.2, colw - f * .8, d, dy.weather_code[j], f * 1.6, f * .6);
      text(cond, mid, rowY(1), fit(cond, f * 1.05, cw), T.gray);
      text(temps, mid, rowY(2), fit(temps, f * 1.1, cw));
      text(rain, mid, rowY(3), fit(rain, f * 1.05, cw), pp >= 30 ? T.rain : T.gray);
    } else if (colw > f * 2.5) {
      const nm = mode === "narrow" ? name.slice(0, 3) : name.split(" ")[0];
      text(nm, mid, rowY(0), fit(nm, f * 1.05, cw, true), T.text, .5, true);
    }
  }

  // panel titles
  const title = (s, x, yb, color, ax = 0) => text(s, x, yb - f * 1.0, f * 1.05, color, ax);

  // ---- wind chart ----
  const ymax = Math.max(30, Math.ceil((Math.max(...idx.map(i => gst[i])) + 3) / 10) * 10);
  const wy = v => wb - v / ymax * (wb - wt);
  for (let v = 10; v <= ymax; v += 10) {
    line([L, wy(v), R, wy(v)], T.grid, 1);
    text(String(v), L - f * .5, wy(v), f, T.gray, 1);
  }
  title("wind mph", L, wt, T.gray);
  line([L, wy(KITE), R, wy(KITE)], [...T.kite.slice(0, 3), .6], 1, [6, 6]);
  const gpts = [], best = new Map();
  idx.forEach((i, k) => {
    const xx = L + k * bw;
    rect(xx + bw * .15, wy(spd[i]), bw * .7, wb - wy(spd[i]), windColor(spd[i]));
    gpts.push(xx + bw / 2, wy(gst[i]));
    const key = isoDate(times[i]);
    if (!best.has(key) || spd[i] > best.get(key)[0]) best.set(key, [spd[i], k, i]);
  });
  line(gpts, T.gust, 1.5);
  let lastX = -1e9;
  if (hourly) idx.forEach((i, k) => {     // every hour's speed
    if (k % step) return;
    const px = L + (k + .5) * bw;
    text(String(Math.round(spd[i])), px, wy(Math.max(spd[i], gst[i])) - f * .8, f * (step > 1 ? .9 : 1), windColor(spd[i]), .5, true);
  });
  else for (const [s, k, i] of best.values()) {  // daily peak
    const px = Math.max(L + f * .9, L + (k + .5) * bw);
    if (px - lastX < f * 3) continue;
    text(String(Math.round(s)), px, wy(gst[i]) - f * .8, f * 1.05, windColor(s), .5, true);
    lastX = px;
  }
  idx.forEach((i, k) => {                  // direction arrows with rain chance
    if (k % step !== Math.floor(step / 2)) return;
    const ax = L + (k + .5) * bw, pr = rainP[i] || 0;
    arrow(ax, arrowY, dirs[i], f * 1.45, windColor(spd[i]));
    text(`${Math.round(pr)}%`, ax, pctY, f * .85, pr >= 30 ? T.rain : T.gray, .5, pr >= 30);
    if (hourly) text(`${Math.round(hr.temperature_2m[i])}°`, ax, tempY, f * .9, T.text);
  });
  if (hourly) text("rain / air", L - f * .5, (pctY + tempY) / 2, f * .7, T.gray, 1);

  // ---- tide chart ----
  if (box.tide) {
    const [tt, tb] = box.tide;
    title("tide ft", L, tt, T.tide);
    const pts = curve.filter(([t]) => t >= ts && t <= t1);
    if (pts.length) {
      const vs = pts.map(p => p[1]);
      const lo = Math.floor(Math.min(...vs) * 2) / 2 - .5, hi = Math.ceil(Math.max(...vs) * 2) / 2 + .6;
      const ty = v => tb - (v - lo) / (hi - lo) * (tb - tt);
      for (let v = Math.ceil(lo); v <= Math.floor(hi); v++) {
        line([L, ty(v), R, ty(v)], T.grid, 1);
        text(String(v), L - f * .5, ty(v), f, T.gray, 1);
      }
      const tl = pts.flatMap(([t, v]) => [xt(t), ty(v)]);
      area(tl, tb, T.tide_fill);
      line(tl, T.tide, 2.5);
      for (const [t, v, typ] of hilo) {
        if (t < ts || t > t1) continue;
        const xx = xt(t), yy = ty(v);
        dot(xx, yy, Math.max(4, f * .3), T.dot);
        const lbl = n <= 170 ? `${short(t)}  ${v.toFixed(1)}` : v.toFixed(1);
        text(lbl, xx, yy + (typ === "H" ? -f * .95 : f * .95), f * (n <= 170 ? .95 : 1));
      }
    }
  }

  // ---- wave chart: height (filled, left axis ft), period (right axis sec), water temp (labelled line) ----
  if (box.wave) {
    const [vt, vb] = box.wave;
    const tw1 = title("wave height ft", L, vt, T.wave);
    title("water °F", L + tw1 + f * 1.5, vt, T.water);
    title("period sec", R, vt, T.period, 1);
    const wv = idx.filter(i => waves.has(hr.time[i])).map(i => [times[i], ...waves.get(hr.time[i])]);
    if (wv.length) {
      const hmax = Math.max(2, Math.ceil(Math.max(...wv.map(v => v[1]))));
      const pmax = Math.max(10, Math.ceil(Math.max(...wv.map(v => v[2])) / 5) * 5);
      const hy = v => vb - v / hmax * (vb - vt), py = v => vb - v / pmax * (vb - vt);
      const hstep = hmax <= 4 ? 1 : 2;
      for (let v = hstep; v <= hmax; v += hstep) {
        line([L, hy(v), R, hy(v)], T.grid, 1);
        text(String(v), L - f * .5, hy(v), f, T.gray, 1);
      }
      for (let v = 5; v <= pmax; v += 5) text(String(v), R + f * .5, py(v), f, T.period, 0);
      const hl = [], pl = [];
      for (const [t, h, p] of wv) { const xx = xt(t) + bw / 2; hl.push(xx, hy(h)); pl.push(xx, py(p)); }
      area(hl, vb, T.wave_fill);
      line(hl, T.wave, 2.5);
      line(pl, T.period, 2);
      const last = wv[wv.length - 1][0];
      if (last < t1 - 6 * 3600e3)
        text("no wave forecast past here", xt(last) + f * .5, (vb + vt) / 2, f * .95, T.gray, 0);
    } else {
      text("Wave data unavailable", (L + R) / 2, (vb + vt) / 2, f, T.gray);
    }
    // water temp: own scale in the upper part of the panel, values written on the line
    const wtp = idx.filter(i => water.has(hr.time[i])).map(i => [times[i], water.get(hr.time[i])]);
    if (wtp.length) {
      const vs = wtp.map(v => v[1]), lo = Math.min(...vs) - 1, hi = Math.max(...vs) + 1;
      const top2 = vt + (vb - vt) * .12, bot2 = vt + (vb - vt) * .55;
      const wy2 = v => bot2 - (v - lo) / (hi - lo) * (bot2 - top2);
      const pl = wtp.flatMap(([t, v]) => [xt(t) + bw / 2, wy2(v)]);
      line(pl, T.water, 2.5, [8, 5]);
      let lx = -1e9;   // label the first point and each noon, if there is room
      wtp.forEach(([t, v], k) => {
        const xx = xt(t) + bw / 2;
        if ((k && t.getHours() !== 12) || xx - lx < f * 3.5) return;
        text(`${Math.round(v)}°`, k ? xx : xx + f * .3, wy2(v) - f * .8, f * .95, T.water, k ? .5 : 0, true);
        lx = xx;
      });
    }
  }

  // hour ticks, past dimming and "now" line
  const tick = n <= 30 ? [...Array(24).keys()] : n <= 50 ? [0, 3, 6, 9, 12, 15, 18, 21] : n <= 100 ? [6, 12, 18] : n <= 170 ? [12] : [];
  idx.forEach((i, k) => { if (tick.includes(times[i].getHours())) text(hourLbl(times[i]), L + k * bw, pBot + f * .9, f * .9, T.gray); });
  const xn = xt(now);
  if (state.past) rect(L, wt, xn - L, pBot - wt, T.past);
  line([xn, pBot, xn, wt], T.now, 1.4);
}

// ---------- buttons, settings, theme, screen ----------
const bar = document.getElementById("bar"), dlg = document.getElementById("settings");
function applyTheme() {
  T = state.light ? LIGHT : DARK;
  const s = document.documentElement.style;
  s.setProperty("--bg", rgba(T.bg)); s.setProperty("--btn", rgba(T.btn));
  s.setProperty("--btntext", rgba(T.btntext)); s.setProperty("--on", rgba(T.kite));
  s.setProperty("--gray", rgba(T.gray)); s.setProperty("--red", rgba(T.red));
  document.querySelector('meta[name="theme-color"]').content = rgba(T.bg);
  document.getElementById("past").classList.toggle("on", state.past);
  bar.querySelectorAll("[data-days]").forEach(b => b.classList.toggle("on", +b.dataset.days === state.days));
  dlg.querySelectorAll("[data-set]").forEach(c => c.checked = !!state[c.dataset.set]);
  dlg.querySelectorAll("[data-size]").forEach(b => b.classList.toggle("on", b.dataset.size === state.textSize));
}
function changed() { save(); applyTheme(); draw(); }
bar.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "gear") { dlg.hidden = false; return; }
  if (b.id === "past") state.past = !state.past;
  else state.days = +b.dataset.days;
  changed();
});
dlg.addEventListener("change", e => {
  const c = e.target.closest("[data-set]"); if (!c) return;
  state[c.dataset.set] = c.checked; changed();
});
dlg.addEventListener("click", e => {
  if (e.target === dlg || e.target.id === "done") { dlg.hidden = true; return; }
  const b = e.target.closest("[data-size]");
  if (b) { state.textSize = b.dataset.size; changed(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") dlg.hidden = true; });

let wakeLock = null;  // keep the screen on while this page is showing
async function keepAwake() {
  try { if ("wakeLock" in navigator && document.visibilityState === "visible") wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    keepAwake();
    if (!state.updated || Date.now() - state.updated > 10 * 60e3) load();
  }
});

window.addEventListener("resize", draw);
applyTheme();
draw();
load();
keepAwake();
setInterval(load, 15 * 60e3);   // new data every 15 min
setInterval(draw, 60e3);        // move "now" line each minute
</script>
</body>
</html>
