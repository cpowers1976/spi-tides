<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPI Tides &amp; Wind</title>
<link rel="manifest" href="tides-manifest.json">
<link rel="icon" href="tides-icon-192.png">
<link rel="apple-touch-icon" href="tides-icon-192.png">
<meta name="theme-color" content="#0f1420">
<style>
  :root { --bg: #0f1420; --btn: #29334a; --btntext: #fff; --on: #4ade80; --gray: #99adc7; --red: #f76659; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden;
               font-family: system-ui, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  canvas { flex: 1; width: 100%; min-height: 0; display: block; }
  #c { position: relative; z-index: 1; }
  /* animation layers: one behind the chart (sun glow, clouds, wind streaks, wave band), one in front */
  #fxb, #fxf { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  #fxb { z-index: 0; } #fxf { z-index: 3; }
  /* the beach that rises from the bottom for Ren's chase, while everything else scrunches up above it */
  #beach { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
  #bar { display: flex; gap: 10px; padding: 8px 16px 12px; align-items: center; position: relative; z-index: 2; }
  button { font: inherit; font-size: 18px; padding: 10px 18px; border: 0; border-radius: 8px;
           background: var(--btn); color: var(--btntext); cursor: pointer; }
  button.on { background: var(--on); color: #fff; }
  #upd { flex: 1; text-align: center; font-size: 17px; color: var(--gray); white-space: nowrap;
         overflow: hidden; text-overflow: ellipsis; }
  #upd.old { color: var(--red); }
  #gear { padding: 8px 12px; display: flex; align-items: center; }
  #gear svg { width: 26px; height: 26px; }
  /* rotate mode: the spin button cycles 24 hours, 3 days, 5 days, 10 days and hides the range buttons */
  #spin { padding: 8px 12px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  #spin svg { width: 24px; height: 24px; flex: none; }
  #spin.on svg { animation: spin 4s linear infinite; }
  #spin .lbl:empty { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  body.rot #bar [data-days], body.rot #past { display: none; }
  body.rot #upd { text-align: left; }

  /* settings window */
  #settings { position: fixed; inset: 0; z-index: 6; background: rgba(0,0,0,.5); display: flex;
              align-items: center; justify-content: center; }
  #settings[hidden] { display: none; }
  .panel { background: var(--bg); color: var(--btntext); border: 1px solid var(--btn); border-radius: 14px;
           padding: 18px 24px 22px; width: min(460px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
           overflow-y: auto; box-sizing: border-box; box-shadow: 0 10px 40px rgba(0,0,0,.4); font-size: 20px; }
  .panel h2 { margin: 0 0 8px; font-size: 24px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px;
         padding: 12px 0; border-bottom: 1px solid var(--btn); cursor: pointer; }
  .row small { display: block; font-size: 15px; color: var(--gray); }
  .sw { appearance: none; -webkit-appearance: none; width: 54px; height: 30px; border-radius: 15px; margin: 0;
        background: var(--btn); position: relative; cursor: pointer; flex: none; transition: background .15s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
               border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .sw:checked { background: var(--on); }
  .sw:checked::after { left: 27px; }
  .row.off { opacity: .45; cursor: default; }
  .row.off .sw { cursor: default; }
  .seg { display: flex; gap: 6px; }
  .seg button { font-size: 17px; padding: 8px 12px; }
  .panel h3 { margin: 22px 0 0; font-size: 21px; }
  .row.sub, .row.ind { padding-left: 16px; }
  .key ol { margin: 8px 0 0; padding-left: 26px; columns: 2; column-gap: 24px; font-size: 15px; color: var(--gray); }
  .key li { break-inside: avoid; padding: 1px 0; }
  .ctl { display: flex; align-items: center; gap: 12px; flex: none; }
  .try { font-size: 15px; padding: 6px 10px; }
  .pick { font-size: 17px; padding: 6px 8px; border-radius: 8px; background: var(--btn); color: var(--btntext); border: none; flex: none; }
  .panel[hidden] { display: none; }
  .navrow { width: 100%; background: none; text-align: left; font-size: 20px; padding: 14px 0; border-radius: 0; }
  .chev { font-size: 30px; color: var(--gray); line-height: 1; }
  .phead { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .phead h2 { margin: 0; }
  .back { font-size: 17px; padding: 8px 12px; }
  .done { width: 100%; margin-top: 18px; font-size: 20px; padding: 12px; }

  /* location picker (opened by tapping the place name) */
  #locmenu { position: fixed; z-index: 5; background: var(--bg); color: var(--btntext); border: 1px solid var(--btn);
             border-radius: 12px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.4); min-width: 280px; }
  #locmenu[hidden], #hint[hidden] { display: none; }
  #locmenu button { display: flex; width: 100%; align-items: center; gap: 12px; background: none; text-align: left;
                    font-size: 21px; padding: 12px 14px; }
  #locmenu button:hover { background: var(--btn); }
  #locmenu .ck { width: 1.1em; color: var(--on); font-weight: bold; }
  #locmenu small { display: block; font-size: 15px; color: var(--gray); }
  #pcttip { position: fixed; z-index: 5; pointer-events: none; background: rgba(20,24,32,.92); color: #fff; font-size: 15px;
    padding: 5px 10px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  #hint { position: fixed; z-index: 5; background: var(--on); color: #fff; font-size: 18px; font-weight: 600;
          padding: 10px 16px; border-radius: 10px; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.35);
          animation: bob 1.6s ease-in-out infinite; }
  #hint::before { content: ""; position: absolute; top: -8px; left: 28px; border: 8px solid transparent;
                  border-top: 0; border-bottom-color: var(--on); }
  @keyframes bob { 50% { transform: translateY(4px); } }
</style>
</head>
<body>
<canvas id="fxb"></canvas>
<canvas id="c"></canvas>
<canvas id="fxf"></canvas>
<canvas id="beach"></canvas>
<div id="bar">
  <button id="past">Past 24h</button>
  <span id="upd"></span>
  <button data-days="1">24 hours</button>
  <button data-days="3">3 days</button>
  <button data-days="5">5 days</button>
  <button data-days="10">10 days</button>
  <button id="spin" aria-label="Rotate forecast range" title="Rotate 24 hours, 3 days, 5 days, 10 days">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.2"/><path d="M3 12A9 9 0 0 1 18.5 5.8"/><path d="M19 2v4.2h-4.2"/><path d="M5 22v-4.2h4.2"/></svg>
    <span class="lbl"></span>
  </button>
  <button id="gear" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</div>
<div id="locmenu" hidden role="menu" aria-label="Choose location"></div>
<div id="hint" hidden>Tap here to switch location</div>
<div id="pcttip" hidden></div>
<div id="settings" hidden>
  <div class="panel" role="dialog" aria-label="Settings" data-pg="main">
    <h2>Settings</h2>
    <div class="row"><span>Location</span>
      <div class="seg"><button data-loc="spi">South Padre</button><button data-loc="spirit">Big Spirit Lake</button></div></div>
    <label class="row"><span>Light mode</span><input type="checkbox" class="sw" data-set="light"></label>
    <label class="row"><span>24-hour clock<small>Show 19:17 instead of 7:17p</small></span><input type="checkbox" class="sw" data-set="clock24"></label>
    <label class="row"><span>Weather icons<small>Sunny, cloudy, rain, storms...</small></span><input type="checkbox" class="sw" data-set="showWx"></label>
    <label class="row"><span>Moon phase</span><input type="checkbox" class="sw" data-set="showMoon"></label>
    <label class="row" id="tiderow"><span>Show tides<small id="tidenote" hidden>No tides on lakes</small></span><input type="checkbox" class="sw" data-set="showTides"></label>
    <label class="row"><span>Show waves<small>Wave height, period and water temp</small></span><input type="checkbox" class="sw" data-set="showWaves"></label>
    <div class="row"><span>Text size</span>
      <div class="seg"><button data-size="s">Small</button><button data-size="m">Medium</button><button data-size="l">Large</button></div></div>
    <label class="row"><span>Rotate forecast range<small>Cycles 24 hours, 3 days, 5 days, 10 days and hides the range buttons. The spin button at the bottom turns it on and off too</small></span><input type="checkbox" class="sw" data-set="rotate"></label>
    <label class="row ind" id="rotrow"><span>Time on each range</span><select class="pick" data-rot="rotSec"><option value="10">10 sec</option><option value="15">15 sec</option><option value="20">20 sec</option><option value="30">30 sec</option><option value="60">1 min</option><option value="120">2 min</option><option value="300">5 min</option></select></label>
    <button class="row navrow" data-page="anim"><span>Animations<small id="animsum">On</small></span><span class="chev">›</span></button>
    <button class="done">Done</button>
  </div>
  <div class="panel" role="dialog" aria-label="Animations" data-pg="anim" hidden>
    <div class="phead"><button class="back" data-page="main">‹ Settings</button><h2>Animations</h2></div>
    <label class="row"><span>All animations<small>Turn them all on or off. Tap ▶ to see one now.</small></span><input type="checkbox" class="sw" data-set="anim"></label>
    <label class="row sub"><span>Time between wildlife<small>Give or take 20%, so it feels random</small></span><select class="pick" data-min="lifeMin"><option value="1">1 min</option><option value="2">2 min</option><option value="3">3 min</option><option value="5">5 min</option><option value="10">10 min</option><option value="15">15 min</option><option value="30">30 min</option></select></label>
    <label class="row sub"><span>Time between big boats<small>Huge, faint boats passing behind the forecast. On their own timer, give or take 20%</small></span><select class="pick" data-min="boatMin"><option value="1">1 min</option><option value="2">2 min</option><option value="3">3 min</option><option value="5">5 min</option><option value="10">10 min</option><option value="15">15 min</option><option value="30">30 min</option></select></label>
    <label class="row sub"><span>Time between other animations<small>Kiteboarder and the ones below Lively numbers (not the page animations). One at a time, give or take 20%</small></span><select class="pick" data-min="otherMin"><option value="2">2 min</option><option value="5">5 min</option><option value="10">10 min</option><option value="15">15 min</option><option value="20">20 min</option><option value="30">30 min</option><option value="45">45 min</option><option value="60">60 min</option></select></label>
    <label class="row sub"><span>Beach scene<small>Ren, the Cybertruck, Starship and the mariachi band get a beach that rises from the bottom while the screen scrunches up. Off: they go by along the wave band</small></span><input type="checkbox" class="sw" data-set="aBeach"></label>
    <label class="row sub"><span>Wave band<small>Bottom edge moves with the real waves</small></span><input type="checkbox" class="sw" data-set="aWaves"></label>
    <label class="row sub"><span>Wind streaks<small>Drift with the real wind direction and speed</small></span><input type="checkbox" class="sw" data-set="aWind"></label>
    <label class="row sub"><span>Kiteboarder<small>Rides by when the wind is 15+ mph</small></span><span class="ctl"><button class="try" data-try="kite">▶</button><input type="checkbox" class="sw" data-set="aKite"></span></label>
    <label class="row sub" id="tidefxrow"><span>Tide shimmer<small>Water ripples at the current tide level</small></span><input type="checkbox" class="sw" data-set="aTide"></label>
    <label class="row sub"><span>Weather<small>Rain, snow, clouds, sun glow, stars</small></span><input type="checkbox" class="sw" data-set="aWx"></label>
    <label class="row sub"><span>Wave wipe<small>Washes in new data every 15 min</small></span><span class="ctl"><button class="try" data-try="wipe">▶</button><input type="checkbox" class="sw" data-set="aWipe"></span></label>
    <label class="row sub"><span>Wildlife<small id="lifenames">Dolphin, redfish, sea turtle, stingray, pelican</small></span><span class="ctl"><button class="try" data-try="life">▶</button><input type="checkbox" class="sw" data-set="aLife"></span></label>
    <label class="row sub"><span>Lively numbers<small>Count up when they change; wind arrow wobbles in gusts</small></span><span class="ctl"><button class="try" data-try="nums">▶</button><input type="checkbox" class="sw" data-set="aNums"></span></label>
    <label class="row sub"><span>Ren chases sanderlings<small>The screen scrunches up, a beach rises, and he chases them along the water's edge</small></span><span class="ctl"><button class="try" data-try="ren">▶</button><input type="checkbox" class="sw" data-set="aRen"></span></label>
    <label class="row sub lakeonly"><span>Queen II<small>Spirit Lake only. The Okoboji excursion boat cruises by</small></span><span class="ctl"><button class="try" data-try="queen">▶</button><input type="checkbox" class="sw" data-set="aQueen"></span></label>
    <label class="row sub lakeonly"><span>The Legend coaster<small>Spirit Lake only. The Arnolds Park coaster fades in, a train full of riders goes over the hills, then it fades away</small></span><span class="ctl"><button class="try" data-try="coaster">▶</button><input type="checkbox" class="sw" data-set="aCoaster"></span></label>
    <label class="row sub"><span>Big boats<small id="boatnames"></small></span><span class="ctl"><button class="try" data-try="ship">▶</button><input type="checkbox" class="sw" data-set="aShip"></span></label>
    <label class="row sub"><span>Yellow submarine<small>Cruises by</small></span><span class="ctl"><button class="try" data-try="sub">▶</button><input type="checkbox" class="sw" data-set="aSub"></span></label>
    <label class="row sub"><span>Cybertruck<small>A beach rises and Elon drives along it, waving</small></span><span class="ctl"><button class="try" data-try="truck">▶</button><input type="checkbox" class="sw" data-set="aTruck"></span></label>
    <label class="row sub"><span>Mariachi band<small>A beach rises and the band plays and dances across it</small></span><span class="ctl"><button class="try" data-try="mariachi">▶</button><input type="checkbox" class="sw" data-set="aMariachi"></span></label>
    <label class="row sub"><span>Slot machine<small>Every number and wind arrow spins like a reel, then lands</small></span><span class="ctl"><button class="try" data-try="slot">▶</button><input type="checkbox" class="sw" data-set="aSlot"></span></label>
    <label class="row sub"><span>Starship launch<small>A beach rises, Starship fades in on Mechazilla, launches, and the booster comes back to be caught</small></span><span class="ctl"><button class="try" data-try="rocket">▶</button><input type="checkbox" class="sw" data-set="aRocket"></span></label>
    <label class="row sub"><span><span id="bitename">Shark bite</span><small>Bites a chunk out of the screen</small></span><span class="ctl"><button class="try" data-try="bite">▶</button><input type="checkbox" class="sw" data-set="aBite"></span></label>
    <h3>Page animations</h3>
    <label class="row sub"><span>Time between page animations<small>The whole page melts or freezes, spins, tumbles, goes haywire, gets crumpled, turned to dust, smashed or hit out of the park, burned or rained on. On their own timer, give or take 20%</small></span><select class="pick" data-min="pageMin"><option value="2">2 min</option><option value="5">5 min</option><option value="10">10 min</option><option value="15">15 min</option><option value="20">20 min</option><option value="30">30 min</option><option value="45">45 min</option><option value="60">60 min</option></select></label>
    <label class="row sub"><span>Melt or freeze<small>80°F+ melts, under <span id="coldF">60</span>°F freezes</small></span><span class="ctl"><button class="try" data-try="melt">▶ Melt</button><button class="try" data-try="freeze">▶ Freeze</button><input type="checkbox" class="sw" data-set="aMelt"></span></label>
    <label class="row sub"><span>Screen spin<small>The whole screen spins one way or the other, speeds up, slows down and lands upside down, then turns itself the right way up</small></span><span class="ctl"><button class="try" data-try="spin">▶</button><input type="checkbox" class="sw" data-set="aSpin"></span></label>
    <label class="row sub"><span>Drive-in sign<small>Spins as one side of a three-sided sign, then pulls back to a busy neon drive-in at night</small></span><span class="ctl"><button class="try" data-try="drivein">▶</button><input type="checkbox" class="sw" data-set="aDrive"></span></label>
    <label class="row sub"><span>Haywire forecast<small>Numbers go wild for 30 s, then it blows up</small></span><span class="ctl"><button class="try" data-try="chaos">▶</button><input type="checkbox" class="sw" data-set="aChaos"></span></label>
    <label class="row sub"><span>End over end<small>Tumbles head over heels, stops backwards, struggles, then flips the right way round</small></span><span class="ctl"><button class="try" data-try="flip">▶</button><input type="checkbox" class="sw" data-set="aFlip"></span></label>
    <label class="row sub"><span>Crumple and toss<small>Crumpled up like paper and thrown in an office wastebasket</small></span><span class="ctl"><button class="try" data-try="crumple">▶</button><input type="checkbox" class="sw" data-set="aCrumple"></span></label>
    <label class="row sub"><span>Turn to dust<small>Yellows, crinkles, crumbles to dust and gets swept away</small></span><span class="ctl"><button class="try" data-try="dust">▶</button><input type="checkbox" class="sw" data-set="aDust"></span></label>
    <label class="row sub"><span>Rock through the glass<small>Three rocks crack it like a windshield, then it shatters to the night sky</small></span><span class="ctl"><button class="try" data-try="rock">▶</button><input type="checkbox" class="sw" data-set="aRock"></span></label>
    <label class="row sub"><span>Home run<small>Rolls up into a ball and a bat knocks it out into the night sky</small></span><span class="ctl"><button class="try" data-try="bat">▶</button><input type="checkbox" class="sw" data-set="aBat"></span></label>
    <label class="row sub"><span>Fire<small>A corner catches fire and it spreads until the whole screen has burned, then the wave puts it out</small></span><span class="ctl"><button class="try" data-try="burn">▶</button><input type="checkbox" class="sw" data-set="aBurn"></span></label>
    <label class="row sub"><span>Rain on water<small>The screen is water. A few drops, then harder and harder until you can't read it, then it eases off</small></span><span class="ctl"><button class="try" data-try="rain">▶</button><input type="checkbox" class="sw" data-set="aRain"></span></label>
    <div class="row key"><span>Rain % shortcuts<small>Tap any rain % under the wind arrows to play an animation. From the left, they play these in order, then start over:</small><ol id="pctkey"></ol></span></div>
    <button class="done">Done</button>
  </div>
</div>
<script>
// Each location: where to get wind/weather, and where tides/waves/water temp come from.
const LOCS = {
  spi: { name: "South Padre Island, Texas", short: "South Padre Island", sub: "Tides, waves and water temp",
         flag: "texas", lat: 26.07, lon: -97.17,
         sea: [26.07, -97.05],             // a few miles offshore, for waves
         station: "8779749", cold: 60 },             // NOAA South Padre Island (Port Isabel 8779770 runs ~30 min later)
  spirit: { name: "Big Spirit Lake, Iowa", short: "Big Spirit Lake", sub: "Lake buoy waves and water temp",
            flag: "iowa", lat: 43.467, lon: -95.10,
            buoy: 2118, cold: 32,
            metar: "KMJQ" },                         // Jackson, MN airport: live wind when the buoy has none                  // Big Spirit Lake research buoy (wqdatalive.com/public/470)
};
// The buoy site doesn't allow other websites to read it, so a small relay on our Cloudflare Pages site fetches it.
const RELAY = /kiteboardokoboji\.com$|pages\.dev$/.test(location.hostname)
  ? "" : "https://spi-tides-app.pages.dev";   // Android app and local copies use the live site's relay
const BUOY_API = RELAY + "/api/buoy", METAR_API = RELAY + "/api/metar";
let LOC = LOCS.spi;
const KITE = 15;                          // bars turn green at this speed (mph)
const STALE_MIN = 35;                     // "Updated" turns red if older than this
const OBS_MIN = 30;                       // live wind older than this (airport: 75 min) shows the forecast instead

const DARK = {
  bg: [.06,.08,.12,1], text: [1,1,1,1], gray: [.6,.68,.78,1], grid: [.2,.25,.32,1], sep: [.25,.3,.4,1],
  day: [.55,.7,.95,.16], night: [0,0,0,.45], past: [0,0,0,.3], gust: [1,1,1,.5], now: [1,1,1,.85],
  dot: [1,1,1,1], red: [.97,.4,.35,1], tide_fill: [.23,.55,.95,.3], tide: [.45,.72,1,1],
  wave_fill: [.2,.8,.75,.3], wave: [.35,.9,.85,1], period: [.95,.6,.95,1], rain: [.45,.72,1,1],
  water: [1,.62,.3,1],
  moon: [.96,.94,.82,1], moon_dark: [.22,.25,.32,1],
  light: [.4,.48,.6,1], breezy: [.98,.8,.3,1], kite: [.29,.87,.5,1], strong: [.97,.45,.3,1],
  btn: [.16,.2,.27,1], btntext: [1,1,1,1] };
const LIGHT = {
  bg: [.97,.97,.95,1], text: [.1,.12,.16,1], gray: [.38,.43,.5,1], grid: [.84,.86,.89,1], sep: [.68,.72,.78,1],
  day: [1,.9,.5,.3], night: [.25,.3,.45,.18], past: [1,1,1,.45], gust: [0,0,0,.45], now: [.1,.1,.1,.8],
  dot: [.1,.1,.1,1], red: [.85,.2,.15,1], tide_fill: [.2,.5,.9,.25], tide: [.1,.4,.8,1],
  wave_fill: [.1,.6,.55,.25], wave: [.05,.5,.45,1], period: [.6,.2,.6,1], rain: [.1,.4,.8,1],
  water: [.85,.4,.05,1],
  moon: [.98,.82,.3,1], moon_dark: [.3,.33,.4,1],

// ---------- data ----------
async function getJSON(url, params) {
  const r = await fetch(url + "?" + new URLSearchParams(params));
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

let loading = 0;
async function load() {
  const L = LOCS[state.loc], my = ++loading;   // a newer load (e.g. after switching location) wins
  let ok = false;
  try {
    const noaa = "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter";
    const q = { product: "predictions", station: L.station, begin_date: ymd(new Date(Date.now() - 86400e3)),
      range: 312, datum: "MLLW", units: "english", time_zone: "lst_ldt", format: "json", application: "casey_app" };
    const none = { predictions: [] };
    const [curve, hilo, w] = await Promise.all([
      L.station ? getJSON(noaa, { ...q, interval: "30" }) : none,
      L.station ? getJSON(noaa, { ...q, interval: "hilo" }) : none,
      getJSON("https://api.open-meteo.com/v1/forecast", {
        latitude: L.lat, longitude: L.lon,
        hourly: "temperature_2m,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m,is_day,precipitation_probability",
        daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",
        wind_speed_unit: "mph", temperature_unit: "fahrenheit", timezone: "America/Chicago",
        past_days: 1, forecast_days: 11 })]);
    const waves = new Map(), water = new Map();
    if (L.sea) try {  // wave forecast only goes about 7 days out
      const r = await getJSON("https://marine-api.open-meteo.com/v1/marine", {
        latitude: L.sea[0], longitude: L.sea[1], hourly: "wave_height,wave_period,sea_surface_temperature",
        timezone: "America/Chicago", past_days: 1, forecast_days: 8 });
      const m = r.hourly, inF = /F/.test((r.hourly_units || {}).sea_surface_temperature || "");
      m.time.forEach((t, i) => {
        const h = m.wave_height[i], p = m.wave_period[i], c = (m.sea_surface_temperature || [])[i];
        if (h != null && p != null) waves.set(t, [h * 3.281, p]);  // meters -> feet
        if (c != null) water.set(t, inF ? c : c * 9 / 5 + 32);     // Celsius -> Fahrenheit
      });
    } catch (e) {}
    let buoy = null;
    if (L.buoy) try { buoy = readBuoy(await getJSON(BUOY_API, { site: L.buoy, v: 2 })   /* v: skip responses cached before the water temp backup */); } catch (e) { buoy = { error: true }; }
    const obs = await getObs(L, buoy);
    if (my !== loading) return;
    state.data = {
      curve: curve.predictions.map(p => [parse(p.t), +p.v]),
      hilo: hilo.predictions.map(p => [parse(p.t), +p.v, p.type]),
      w, waves, water, buoy, obs };
    state.updated = new Date();
    state.error = "";
    ok = true;
  } catch (e) {
    if (my !== loading) return;
    state.error = `Update failed ${hm(new Date())}, retrying`;
    setTimeout(load, 120e3);
  }
  const old = ok && on("aWipe") ? snapshot() : null;   // wave washes the new data in
  draw();
  if (old) play("wipe", { old });
  if (ok) FX.tideFlood = performance.now();
}

// latest live wind -> { time, spd, gst, dir, where, maxMin } in mph, or null
//   South Padre: NOAA's sensor on the Brazos Santiago jetty (every 6 minutes)
//   Big Spirit Lake: the buoy if it reports wind, otherwise the Jackson, MN airport (about every 20 minutes)
async function getObs(L, buoy) {
  if (L.station) try {
    const j = await getJSON("https://api.tidesandcurrents.noaa.gov/api/prod/datagetter", { product: "wind", station: L.station,
      date: "latest", units: "english", time_zone: "lst_ldt", format: "json", application: "casey_app" });
    const o = (j.data || [])[0];
    if (!o || o.s === "" || isNaN(+o.s)) return null;
    return { time: parse(o.t), spd: +o.s, gst: o.g === "" ? null : +o.g, dir: o.d === "" ? null : +o.d,
             where: "at the jetty", maxMin: OBS_MIN };
  } catch (e) { return null; }
  if (buoy && buoy.live && buoy.wind) return { ...buoy.wind, time: buoy.time, where: "at the buoy", maxMin: OBS_MIN * 3 };
  if (L.metar) try {
    const j = await getJSON(METAR_API, { id: L.metar });
    const kt = 1.15078;   // knots -> mph
    return { time: new Date(j.time), spd: j.spdKt * kt, gst: j.gstKt == null ? null : j.gstKt * kt, dir: j.dir,
             where: "at Jackson airport", maxMin: 75 };
  } catch (e) { return null; }
  return null;
}
async function refreshObs() {   // between full updates, keep the live wind fresh
  const d = state.data, L = LOCS[state.loc];
  if (!d || document.visibilityState === "hidden") return;
  const obs = await getObs(L, d.buoy);
  if (state.data === d && LOCS[state.loc] === L && obs) { d.obs = obs; draw(); }
}

// latest buoy reading -> { time, live, waveFt, period, waterF }; live = reported in the last 3 hours
// lake = backup water temp (LakeMonster) for when the buoy is out
function readBuoy(j) {
  const lake = j && j.lake && j.lake.waterF != null ? j.lake : null;
  if (!j || !j.time) return { error: true, lake };
  const r = j.readings || {}, val = k => (r[k] || {}).value;
  const time = new Date(j.time), hs = val("Hs Wave Height"), wt = val("Water Temperature at surface");
  // wind, if this buoy has an anemometer (names vary, so match loosely); m/s or knots -> mph
  const pick = re => { const k = Object.keys(r).find(n => re.test(n)); return k ? r[k] : null; };
  const mph = p => p == null ? null : /m\/s/i.test(p.unit) ? p.value * 2.237 : /kn|kt/i.test(p.unit) ? p.value * 1.15078 : /km/i.test(p.unit) ? p.value / 1.609 : p.value;
  const ws = pick(/wind speed/i), wg = pick(/gust/i), wd = pick(/wind dir/i);
  const wind = ws ? { spd: mph(ws), gst: mph(wg), dir: wd ? wd.value : null } : null;

           period: val("Tp (DPD) Wave Period"), waterF: wt };
}

// ---------- drawing ----------
const cv = document.getElementById("c");
let ctx = cv.getContext("2d");   // swapped to the animation layers while they draw
const mainCtx = ctx;
let hourBoxes = [], pctBoxes = [];   // tap areas of the x-axis time labels and the rain percentages

function setFont(size, bold) { ctx.font = `${bold ? "bold " : ""}${size}px system-ui, Roboto, sans-serif`; }
function text(s, x, y, size, color, ax = .5, bold = false) {
  setFont(size, bold);

  ctx.textBaseline = "middle";
  const w = ctx.measureText(s).width;
  if (FX.slot && ctx === mainCtx && /\d/.test(s) && reelText(s, x - w * ax, y, size)) return w;
  ctx.fillText(s, x - w * ax, y);
  return w;
}
// ---- slot machine: every number spins like a reel, then lands, left to right ----
const REEL_V = 14, REEL_A = 1.2, REEL_D = .7;   // digits a second at full spin; seconds to speed up; seconds to slow down
function reelLeft(x, y, i = 0) {  // how many digits this reel still has to turn (0 = landed)
  if (FX.slot.wild) {   // haywire: spinning faster and faster, never landing
    const tt = (performance.now() - FX.slot.t0) / 1000;
    return { r: 1e4 - (8 * tt + 9 * tt * tt) - x * .37 - i * 1.7, since: -1 };
  }
  const t = (performance.now() - FX.slot.t0) / 1000, W = cv.clientWidth || 1, A = REEL_A, D = REEL_D;
  const stop = 1.9 + 2.4 * Math.min(1, Math.max(0, x / W)) + .25 * (y / (cv.clientHeight || 1)) + i * .06;
  const k = A / 3 + (stop - D - A) + D / 2;   // distance covered at a speed of 1
  const total = 10 * Math.ceil((REEL_V * k + i * 1.7) / 10), v = total / k;   // whole turns, so it starts on the real value
  const done = t < A ? v * t ** 3 / (3 * A * A)   // starts slow and speeds up
    : t < stop - D ? v * (A / 3 + t - A)
    : v * (A / 3 + stop - D - A) + v / (2 * D) * (D * D - Math.max(0, stop - t) ** 2);
  return { r: Math.max(0, total - done), since: t - stop };
}

  for (const ch of s) {
    const cw = ctx.measureText(ch).width;
    if (/\d/.test(ch)) {

function arrow(cx, cy, deg, size, color) {

// ---------- weather icons (drawn, so they look the same on every device) ----------
function wxKind(code) {
  if (code >= 95) return "storm";
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return "snow";
  if (code >= 80) return "showers";
  if (code >= 61) return "rain";
  if (code >= 51) return "drizzle";
  if (code >= 45) return "fog";

function sun(cx, cy, r) {
  const c = rgba([.99, .78, .2, 1]);
  ctx.strokeStyle = c; ctx.lineWidth = Math.max(1.5, r * .22); ctx.lineCap = "round";
  ctx.beginPath();

    const a = k * Math.PI / 4;
    ctx.moveTo(cx + Math.cos(a) * r * 1.35, cy + Math.sin(a) * r * 1.35);
    ctx.lineTo(cx + Math.cos(a) * r * 1.8, cy + Math.sin(a) * r * 1.8);

  ctx.fillStyle = rgba(dark ? (state.light ? [.45,.5,.58,1] : [.62,.67,.75,1])

  if (k === "partly") { sun(cx - s * .2, cy - s * .15, s * .22); return cloud(cx + s * .08, cy + s * .08, s * .95); }
  if (k === "showers") sun(cx - s * .28, cy - s * .25, s * .18);

  cloud(cx, wet ? cy - s * .14 : cy, s * 1.05, wet);
  const top = cy + s * .16;
  if (k === "fog") {
    line([cx - s * .45, cy + s * .32, cx + s * .45, cy + s * .32], T.gray, Math.max(1.5, s * .07));
    line([cx - s * .35, cy + s * .46, cx + s * .35, cy + s * .46], T.gray, Math.max(1.5, s * .07));

// name of a day with its weather icon on the left and moon on the right, fitted to the column
function dayTitle(name, mid, y, size, maxW, d, code, iconS, moonR) {

  const ns = fit(name, size, maxW - ic - mn, true);

  for (let s = 24; s >= 0; s--) { const y = -r + 2*r*s/24; ctx.lineTo(cx + side * k * Math.sqrt(Math.max(r*r - y*y, 0)), cy + y); }

      }

      area(tl, tb, T.tide_fill);
      line(tl, T.tide, 2.5);
      const k = curve.findIndex(([t]) => t > now);   // current tide level, for the shimmer animation

  idx.forEach((i, k) => {

// ---------- forecast range: changing it, and rotate mode ----------
const RANGES = [1, 3, 5, 10], RANGE_NAME = { 1: "24 hours", 3: "3 days", 5: "5 days", 10: "10 days" };

  crossfade(500);

// ---------- buttons, settings, theme, screen ----------
const bar = document.getElementById("bar"), dlg = document.getElementById("settings");

// ---------- animations ----------
// Two see-through layers: fxb behind the chart (sun glow, clouds, stars, wind streaks, wave band)
// and fxf in front (rain/snow, tide shimmer, kiteboarder, dolphin/walleye, wave wipe, melt, wobbly arrow).
// Runs at most ~30 frames a second and stops when nothing is moving.
let G = null;   // chart layout and current conditions, filled in by chart()
const on = k => !!(state.anim && state[k]);
const fxb = document.getElementById("fxb"), fxf = document.getElementById("fxf");
const bctx = fxb.getContext("2d"), fctx = fxf.getContext("2d");
const MIN = 60e3, rnd = (a, b) => a + Math.random() * (b - a), gap = m => m * MIN * rnd(.8, 1.2), clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const FX = { streaks: [], drops: [], clouds: [], stars: [], splash: [], events: [], flash: 0, nextFlash: 0, tideFlood: 0,
             next: { life: performance.now() + Math.min(90e3, gap(state.lifeMin)), other: performance.now() + Math.min(3 * MIN, gap(state.otherMin)), boat: performance.now() + Math.min(60e3, gap(state.boatMin)), page: performance.now() + Math.min(4 * MIN, gap(state.pageMin)) }, last: "", lifeIdx: 0, boatIdx: 0, slot: null };

// numbers that count up to their new value
const NUM = {}, NUM_MS = 1400;
let numUntil = 0;
const numAt = (n, t) => n.a + (n.b - n.a) * (1 - (1 - Math.min(1, (t - n.t0) / NUM_MS)) ** 3);
function num(k, v) {
  const t = performance.now();
  if (FX.chaos) return v;   // haywire forecast: show the wild numbers as they are
  if (v == null || !on("aNums")) { NUM[k] = { a: v, b: v, t0: 0 }; return v; }
  let n = NUM[k];
  if (!n || n.b == null) n = NUM[k] = { a: 0, b: v, t0: t };            // first reading: count up from zero
  else if (n.b !== v) n = NUM[k] = { a: numAt(n, t), b: v, t0: t };

// wind direction as a screen vector the air moves toward
function windVec() {
  const a = ((G ? G.dir : 270) + 180) * Math.PI / 180;
  return [Math.sin(a), -Math.cos(a)];
}

// ---- wave band along the bottom (behind the buttons) ----
function bandParams(S) {
  const top = cv.clientHeight, bh = Math.max(40, S.h - top), spd = G ? G.spd : 8;
  let A, lam, per;
  if (G && G.wave) {

    A = clamp(2 + ft * 3, 2, bh * .3); per = clamp(p || 6, 2, 16); lam = clamp(per * 30, 40, 420);
  } else if (G && G.lakeCalm) {        // lake buoy out: gentle ripples, a bit livelier with wind
    A = 1.5 + Math.min(4, spd * .12); per = 2.2; lam = 46;

    ctx.beginPath(); ctx.moveTo(0, S.h);

    ctx.lineTo(S.w + 8, S.h); ctx.closePath();

      ctx.strokeStyle = state.light ? "rgba(255,255,255,.8)" : "rgba(255,255,255,.3)"; ctx.lineWidth = 1.5; ctx.stroke();
    }

// ---- wind streaks (behind the chart) ----
function streaks(dt, sec) {
  const spd = G.spd, n = spd < 3 ? 0 : Math.min(36, Math.round(spd * 1.2));
  FX.streaks.length = Math.min(FX.streaks.length, n);
  const fresh = () => ({ x: rnd(0, G.W), y: rnd(G.top + G.f, G.H), age: 0, life: rnd(1.2, 2.6), k: rnd(.7, 1.3), ph: rnd(0, 6) });
  while (FX.streaks.length < n) { const s = fresh(); s.age = rnd(0, s.life); FX.streaks.push(s); }
  if (!n) return false;
  const [vx, vy] = windVec(), v = 40 + spd * 12, len = 18 + spd * 2.2, gusty = Math.max(0, G.gst - spd) / Math.max(spd, 1);
  ctx.lineCap = "round"; ctx.lineWidth = 1 + spd / 25;
  FX.streaks.forEach((s, i) => {

    s.x += vx * sp * dt; s.y += vy * sp * dt; s.age += dt;
    if (s.age > s.life || s.x < -50 || s.x > G.W + 50 || s.y < G.top || s.y > G.H + 30) { FX.streaks[i] = fresh(); return; }
    ctx.strokeStyle = rgba([...T.text.slice(0, 3), (state.light ? .3 : .22) * Math.sin(Math.PI * s.age / s.life)]);
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - vx * len * s.k, s.y - vy * len * s.k); ctx.stroke();

// ---- weather: sun glow, stars, clouds, fog (behind); rain, snow, lightning (in front) ----
function wxBack(dt, sec) {

    const g = ctx.createRadialGradient(W * .94, -H * .04, 0, W * .94, -H * .04, W * .5);
    const a = (state.light ? .3 : .17) + .05 * Math.sin(sec * .5);

    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); any = true;

    if (!FX.stars.length) for (let i = 0; i < 45; i++) FX.stars.push([Math.random(), Math.random(), rnd(.6, 1.6), rnd(0, 6), rnd(1, 2.5)]);
    for (const [x, y, r, ph, sp] of FX.stars) dot(x * W, y * H * .3, r, [1, 1, 1, .12 + .3 * (.5 + .5 * Math.sin(sec * sp + ph))]);

  ctx.save();

  for (let i = 0; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.lineTo(pts[pts.length - 2], tb); ctx.closePath(); ctx.clip();

  ctx.lineWidth = 1.5;

  ctx.fillStyle = g; ctx.fillRect(sx - 140, tt, 280, tb - tt);

  const b = pctBoxes[i], r = cv.getBoundingClientRect(), list = pctList();
  pcttip.textContent = "▶ " + list[i % list.length][1];
  pcttip.style.left = `${Math.min(innerWidth - 90, Math.max(90, r.left + b.x + b.w / 2))}px`; pcttip.style.top = `${r.top + b.y}px`;
  pcttip.hidden = false;
  clearTimeout(tipTimer); if (ms) tipTimer = setTimeout(hidePctTip, ms);
}
function hidePctTip() { pcttip.hidden = true; }
cv.addEventListener("pointerdown", e => {
  if (e.pointerType !== "touch") return;
  pressShown = false; clearTimeout(pressTimer);
  const pi = inPct(e);
  if (pi >= 0) pressTimer = setTimeout(() => { pressShown = true; showPctTip(pi, 2000); }, 450);
});
for (const ev of ["pointerup", "pointercancel", "pointermove"]) cv.addEventListener(ev, e => { if (ev !== "pointermove" || Math.abs(e.movementX) + Math.abs(e.movementY) > 6) clearTimeout(pressTimer); });
cv.addEventListener("contextmenu", e => { if (inPct(e) >= 0) e.preventDefault(); });
hint.addEventListener("click", openMenu);
menu.addEventListener("click", e => { const b = e.target.closest("[data-loc]"); if (b) setLoc(b.dataset.loc); });
bar.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "gear") { dlg.hidden = false; return; }
  if (b.id === "spin") { setRotate(!state.rotate); return; }
  if (b.id === "past") { state.past = !state.past; changed(); return; }
  setRange(+b.dataset.days);
});
dlg.addEventListener("change", e => {
  if (e.target.dataset.rot) { state.rotSec = +e.target.value; save(); rotTimer(); return; }
  if (e.target.dataset.set === "rotate") { setRotate(e.target.checked); return; }
  const m = e.target.closest("[data-min]");
  if (m) { state[m.dataset.min] = +m.value; const k = { lifeMin: "life", boatMin: "boat", pageMin: "page" }[m.dataset.min] || "other"; FX.next[k] = performance.now() + gap(state[m.dataset.min]); changed(); return; }
  const c = e.target.closest("[data-set]"); if (!c) return;
  state[c.dataset.set] = c.checked; changed();
});
function showPage(name) {   // Settings has a main page and an Animations page
  dlg.querySelectorAll("[data-pg]").forEach(p => p.hidden = p.dataset.pg !== name);
  const shown = dlg.querySelector(`[data-pg="${name}"]`); if (shown) shown.scrollTop = 0;
}
dlg.addEventListener("click", e => {
  if (e.target === dlg || e.target.closest(".done")) { dlg.hidden = true; showPage("main"); return; }
  const pg = e.target.closest("[data-page]");
  if (pg) { showPage(pg.dataset.page); return; }
  const t = e.target.closest("[data-try]");
  if (t) { e.preventDefault(); dlg.hidden = true; showPage("main"); play(t.dataset.try); return; }
  const b = e.target.closest("[data-size]");
  if (b) { state.textSize = b.dataset.size; changed(); }
  const l = e.target.closest("[data-loc]");
  if (l) setLoc(l.dataset.loc);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") dlg.hidden = menu.hidden = true; });

let wakeLock = null;  // keep the screen on while this page is showing
async function keepAwake() {
  try { if ("wakeLock" in navigator && document.visibilityState === "visible") wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    keepAwake(); fxKick();
    if (!state.updated || Date.now() - state.updated > 10 * 60e3) load(); else refreshObs();
  }
});

window.addEventListener("resize", draw);
document.title = `${LOC.short} Wind${LOC.station ? " & Tides" : ""}`;
applyTheme();
draw();
load();
keepAwake();
rotTimer();
setInterval(load, 15 * 60e3);   // new data every 15 min
setInterval(refreshObs, 6 * 60e3);   // the NOAA wind sensor reports every 6 min
setInterval(draw, 60e3);        // move "now" line each minute
</script>
</body>
