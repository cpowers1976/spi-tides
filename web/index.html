<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPI Tides &amp; Wind</title>
<link rel="manifest" href="tides-manifest.json">
<link rel="icon" href="tides-icon-192.png">
<link rel="apple-touch-icon" href="tides-icon-192.png">
<meta name="theme-color" content="#0f1420">
<style>
  :root { --bg: #0f1420; --btn: #29334a; --btntext: #fff; --on: #4ade80; --gray: #99adc7; --red: #f76659; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden;
               font-family: system-ui, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  canvas { flex: 1; width: 100%; min-height: 0; display: block; }
  #c { position: relative; z-index: 1; }
  /* animation layers: one behind the chart (sun glow, clouds, wind streaks, wave band), one in front */
  #fxb, #fxf { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  #fxb { z-index: 0; } #fxf { z-index: 3; }
  #bar { display: flex; gap: 10px; padding: 8px 16px 12px; align-items: center; position: relative; z-index: 2; }
  button { font: inherit; font-size: 18px; padding: 10px 18px; border: 0; border-radius: 8px;
           background: var(--btn); color: var(--btntext); cursor: pointer; }
  button.on { background: var(--on); color: #fff; }
  #upd { flex: 1; text-align: center; font-size: 17px; color: var(--gray); white-space: nowrap;
         overflow: hidden; text-overflow: ellipsis; }
  #upd.old { color: var(--red); }
  #gear { padding: 8px 12px; display: flex; align-items: center; }
  #gear svg { width: 26px; height: 26px; }

  /* settings window */
  #settings { position: fixed; inset: 0; z-index: 6; background: rgba(0,0,0,.5); display: flex;
              align-items: center; justify-content: center; }
  #settings[hidden] { display: none; }
  .panel { background: var(--bg); color: var(--btntext); border: 1px solid var(--btn); border-radius: 14px;
           padding: 18px 24px 22px; width: min(460px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
           overflow-y: auto; box-sizing: border-box; box-shadow: 0 10px 40px rgba(0,0,0,.4); font-size: 20px; }
  .panel h2 { margin: 0 0 8px; font-size: 24px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px;
         padding: 12px 0; border-bottom: 1px solid var(--btn); cursor: pointer; }
  .row small { display: block; font-size: 15px; color: var(--gray); }
  .sw { appearance: none; -webkit-appearance: none; width: 54px; height: 30px; border-radius: 15px; margin: 0;
        background: var(--btn); position: relative; cursor: pointer; flex: none; transition: background .15s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
               border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .sw:checked { background: var(--on); }
  .sw:checked::after { left: 27px; }
  .row.off { opacity: .45; cursor: default; }
  .row.off .sw { cursor: default; }
  .seg { display: flex; gap: 6px; }
  .seg button { font-size: 17px; padding: 8px 12px; }
  .panel h3 { margin: 22px 0 0; font-size: 21px; }
  .row.sub { padding-left: 16px; }
  .ctl { display: flex; align-items: center; gap: 12px; flex: none; }
  .try { font-size: 15px; padding: 6px 10px; }
  #done { width: 100%; margin-top: 18px; font-size: 20px; padding: 12px; }

  /* location picker (opened by tapping the place name) */
  #locmenu { position: fixed; z-index: 5; background: var(--bg); color: var(--btntext); border: 1px solid var(--btn);
             border-radius: 12px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.4); min-width: 280px; }
  #locmenu[hidden], #hint[hidden] { display: none; }
  #locmenu button { display: flex; width: 100%; align-items: center; gap: 12px; background: none; text-align: left;
                    font-size: 21px; padding: 12px 14px; }
  #locmenu button:hover { background: var(--btn); }
  #locmenu .ck { width: 1.1em; color: var(--on); font-weight: bold; }
  #locmenu small { display: block; font-size: 15px; color: var(--gray); }
  #hint { position: fixed; z-index: 5; background: var(--on); color: #fff; font-size: 18px; font-weight: 600;
          padding: 10px 16px; border-radius: 10px; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.35);
          animation: bob 1.6s ease-in-out infinite; }
  #hint::before { content: ""; position: absolute; top: -8px; left: 28px; border: 8px solid transparent;
                  border-top: 0; border-bottom-color: var(--on); }
  @keyframes bob { 50% { transform: translateY(4px); } }
</style>
</head>
<body>
<canvas id="fxb"></canvas>
<canvas id="c"></canvas>
<canvas id="fxf"></canvas>
<div id="bar">
  <button id="past">Past 24h</button>
  <span id="upd"></span>
  <button data-days="1">24 hours</button>
  <button data-days="3">3 days</button>
  <button data-days="5">5 days</button>
  <button data-days="10">10 days</button>
  <button id="gear" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</div>
<div id="locmenu" hidden role="menu" aria-label="Choose location"></div>
<div id="hint" hidden>Tap here to switch location</div>
<div id="settings" hidden>
  <div class="panel" role="dialog" aria-label="Settings">
    <h2>Settings</h2>
    <div class="row"><span>Location</span>
      <div class="seg"><button data-loc="spi">South Padre</button><button data-loc="spirit">Big Spirit Lake</button></div></div>
    <label class="row"><span>Light mode</span><input type="checkbox" class="sw" data-set="light"></label>
    <label class="row"><span>24-hour clock<small>Show 19:17 instead of 7:17p</small></span><input type="checkbox" class="sw" data-set="clock24"></label>
    <label class="row"><span>Weather icons<small>Sunny, cloudy, rain, storms...</small></span><input type="checkbox" class="sw" data-set="showWx"></label>
    <label class="row"><span>Moon phase</span><input type="checkbox" class="sw" data-set="showMoon"></label>
    <label class="row" id="tiderow"><span>Show tides<small id="tidenote" hidden>No tides on lakes</small></span><input type="checkbox" class="sw" data-set="showTides"></label>
    <label class="row"><span>Show waves<small>Wave height, period and water temp</small></span><input type="checkbox" class="sw" data-set="showWaves"></label>
    <div class="row"><span>Text size</span>
      <div class="seg"><button data-size="s">Small</button><button data-size="m">Medium</button><button data-size="l">Large</button></div></div>
    <h3>Animations</h3>
    <label class="row"><span>Animations<small>Turn them all on or off. Tap ▶ to see one now.</small></span><input type="checkbox" class="sw" data-set="anim"></label>
    <label class="row sub"><span>Wave band<small>Bottom edge moves with the real waves</small></span><input type="checkbox" class="sw" data-set="aWaves"></label>
    <label class="row sub"><span>Wind streaks<small>Drift with the real wind direction and speed</small></span><input type="checkbox" class="sw" data-set="aWind"></label>
    <label class="row sub"><span>Kiteboarder<small>Rides by every few minutes at 15+ mph</small></span><span class="ctl"><button class="try" data-try="kite">▶</button><input type="checkbox" class="sw" data-set="aKite"></span></label>
    <label class="row sub" id="tidefxrow"><span>Tide shimmer<small>Water ripples at the current tide level</small></span><input type="checkbox" class="sw" data-set="aTide"></label>
    <label class="row sub"><span>Weather<small>Rain, snow, clouds, sun glow, stars</small></span><input type="checkbox" class="sw" data-set="aWx"></label>
    <label class="row sub"><span>Melt or freeze<small>80°F+ melts, under <span id="coldF">60</span>°F freezes</small></span><span class="ctl"><button class="try" data-try="melt">▶ Melt</button><button class="try" data-try="freeze">▶ Freeze</button><input type="checkbox" class="sw" data-set="aMelt"></span></label>
    <label class="row sub"><span>Wave wipe<small>Washes in new data every 15 min</small></span><span class="ctl"><button class="try" data-try="wipe">▶</button><input type="checkbox" class="sw" data-set="aWipe"></span></label>
    <label class="row sub"><span>Wildlife<small id="lifenames">Dolphin, redfish, sea turtle, stingray, pelican</small></span><span class="ctl"><button class="try" data-try="life">▶</button><input type="checkbox" class="sw" data-set="aLife"></span></label>
    <label class="row sub"><span>Lively numbers<small>Count up when they change; wind arrow wobbles in gusts</small></span><span class="ctl"><button class="try" data-try="nums">▶</button><input type="checkbox" class="sw" data-set="aNums"></span></label>
    <label class="row sub"><span>Ren chases sanderlings<small>Along the water's edge, every 20 to 30 min</small></span><span class="ctl"><button class="try" data-try="ren">▶</button><input type="checkbox" class="sw" data-set="aRen"></span></label>
    <label class="row sub"><span>Yellow submarine<small>Cruises by every 30 to 45 min</small></span><span class="ctl"><button class="try" data-try="sub">▶</button><input type="checkbox" class="sw" data-set="aSub"></span></label>
    <label class="row sub"><span><span id="bitename">Shark bite</span><small>Bites a chunk out of the screen, about once an hour</small></span><span class="ctl"><button class="try" data-try="bite">▶</button><input type="checkbox" class="sw" data-set="aBite"></span></label>
    <label class="row sub"><span>Haywire forecast<small>Numbers go wild for 30 s, then it blows up. About once an hour</small></span><span class="ctl"><button class="try" data-try="chaos">▶</button><input type="checkbox" class="sw" data-set="aChaos"></span></label>
    <button id="done">Done</button>
  </div>
</div>
<script>
// Each location: where to get wind/weather, and where tides/waves/water temp come from.
const LOCS = {
  spi: { name: "South Padre Island, Texas", short: "South Padre Island", sub: "Tides, waves and water temp",
         flag: "texas", lat: 26.07, lon: -97.17,
         sea: [26.07, -97.05],             // a few miles offshore, for waves
         station: "8779749", cold: 60 },             // NOAA South Padre Island (Port Isabel 8779770 runs ~30 min later)
  spirit: { name: "Big Spirit Lake, Iowa", short: "Big Spirit Lake", sub: "Lake buoy waves and water temp",
            flag: "iowa", lat: 43.467, lon: -95.10,
            buoy: 2118, cold: 32 },                  // Big Spirit Lake research buoy (wqdatalive.com/public/470)
};
// The buoy site doesn't allow other websites to read it, so a small relay on our Cloudflare Pages site fetches it.
const BUOY_API = /kiteboardokoboji\.com$|pages\.dev$/.test(location.hostname)
  ? "/api/buoy" : "https://spi-tides-app.pages.dev/api/buoy";   // Android app and local copies
let LOC = LOCS.spi;
const KITE = 15;                          // bars turn green at this speed (mph)
const STALE_MIN = 35;                     // "Updated" turns red if older than this

const DARK = {
  bg: [.06,.08,.12,1], text: [1,1,1,1], gray: [.6,.68,.78,1], grid: [.2,.25,.32,1], sep: [.25,.3,.4,1],
  day: [.55,.7,.95,.16], night: [0,0,0,.45], past: [0,0,0,.3], gust: [1,1,1,.5], now: [1,1,1,.85],
  dot: [1,1,1,1], red: [.97,.4,.35,1], tide_fill: [.23,.55,.95,.3], tide: [.45,.72,1,1],
  wave_fill: [.2,.8,.75,.3], wave: [.35,.9,.85,1], period: [.95,.6,.95,1], rain: [.45,.72,1,1],
  water: [1,.62,.3,1],
  moon: [.96,.94,.82,1], moon_dark: [.22,.25,.32,1],
  light: [.4,.48,.6,1], breezy: [.98,.8,.3,1], kite: [.29,.87,.5,1], strong: [.97,.45,.3,1],
  btn: [.16,.2,.27,1], btntext: [1,1,1,1] };
const LIGHT = {
  bg: [.97,.97,.95,1], text: [.1,.12,.16,1], gray: [.38,.43,.5,1], grid: [.84,.86,.89,1], sep: [.68,.72,.78,1],
  day: [1,.9,.5,.3], night: [.25,.3,.45,.18], past: [1,1,1,.45], gust: [0,0,0,.45], now: [.1,.1,.1,.8],
  dot: [.1,.1,.1,1], red: [.85,.2,.15,1], tide_fill: [.2,.5,.9,.25], tide: [.1,.4,.8,1],
  wave_fill: [.1,.6,.55,.25], wave: [.05,.5,.45,1], period: [.6,.2,.6,1], rain: [.1,.4,.8,1],
  water: [.85,.4,.05,1],
  moon: [.98,.82,.3,1], moon_dark: [.3,.33,.4,1],
  light: [.55,.6,.68,1], breezy: [.9,.62,.05,1], kite: [.1,.65,.3,1], strong: [.88,.3,.15,1],
  btn: [.85,.87,.9,1], btntext: [.1,.12,.16,1] };

const WMO = {0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Cloudy",45:"Fog",48:"Fog",51:"Drizzle",
  53:"Drizzle",55:"Drizzle",56:"Freezing drizzle",57:"Freezing drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",
  66:"Freezing rain",67:"Freezing rain",71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow",80:"Showers",81:"Showers",
  85:"Snow showers",86:"Snow showers",
  82:"Heavy showers",95:"T-storms",96:"T-storms",99:"T-storms"};
const DIRS = "N NNE NE ENE E ESE SE SSE S SSW SW WSW W WNW NW NNW".split(" ");

// remembered settings
const FXKEYS = ["aWaves", "aWind", "aKite", "aTide", "aWx", "aMelt", "aWipe", "aLife", "aNums", "aChaos", "aBite", "aRen", "aSub"];   // one switch per animation
const SAVED = ["loc", "hintSeen", "days", "past", "light", "clock24", "showTides", "showWaves", "showWx", "showMoon", "textSize", "anim", ...FXKEYS];
const state = { loc: "spi", hintSeen: false, days: 3, past: false, light: false, clock24: false, showTides: true, showWaves: true, showWx: true, showMoon: true,
                textSize: "m", data: null, updated: null, error: "",
                // animations start off if the device asks for reduced motion (Android: Remove animations)
                anim: !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) };
for (const k of FXKEYS) state[k] = true;
try {
  const s = JSON.parse(localStorage.getItem("spi-tides") || "{}");
  for (const k of SAVED) if (k in s) state[k] = s[k];
} catch (e) {}
const urlLoc = new URLSearchParams(location.search).get("loc");   // e.g. ?loc=spirit opens the lake
if (urlLoc in LOCS) state.loc = urlLoc;
if (!(state.loc in LOCS)) state.loc = "spi";
LOC = LOCS[state.loc];
function save() {
  try { localStorage.setItem("spi-tides", JSON.stringify(Object.fromEntries(SAVED.map(k => [k, state[k]])))); } catch (e) {}
}
let T = state.light ? LIGHT : DARK;

// ---------- helpers ----------
const rgba = a => `rgba(${Math.round(a[0]*255)},${Math.round(a[1]*255)},${Math.round(a[2]*255)},${a[3] ?? 1})`;
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hourKey = d => `${isoDate(d)}T${pad(d.getHours())}:00`;
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
function parse(s) {  // "2026-11-06 21:17" or "2026-11-06T21:00", local time
  const m = s.match(/(\d+)-(\d+)-(\d+)[T ](\d+):(\d+)/);
  return new Date(+m[1], m[2]-1, +m[3], +m[4], +m[5]);
}
const h12 = d => d.getHours() % 12 || 12;
const ap = d => d.getHours() < 12 ? "a" : "p";
const hh24 = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const hm = d => state.clock24 ? hh24(d) : `${h12(d)}:${pad(d.getMinutes())} ${d.getHours() < 12 ? "AM" : "PM"}`;
const short = d => state.clock24 ? hh24(d) : `${h12(d)}:${pad(d.getMinutes())}${ap(d)}`;
const hourLbl = d => state.clock24 ? `${pad(d.getHours())}:00` : `${h12(d)}${ap(d)}`;
const compass = d => DIRS[Math.round(d / 22.5) % 16];
const windColor = s => s >= 25 ? T.strong : s >= KITE ? T.kite : s >= 10 ? T.breezy : T.light;
function moonAge(d) {  // 0 = new, 0.5 = full
  const ref = Date.UTC(2000, 0, 6, 18, 14), syn = 29.530589;
  const days = (midnight(d).getTime() + 18 * 3600e3 - ref) / 86400e3;
  return ((days % syn) + syn) % syn / syn;
}

// ---------- data ----------
async function getJSON(url, params) {
  const r = await fetch(url + "?" + new URLSearchParams(params));
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

let loading = 0;
async function load() {
  const L = LOCS[state.loc], my = ++loading;   // a newer load (e.g. after switching location) wins
  let ok = false;
  try {
    const noaa = "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter";
    const q = { product: "predictions", station: L.station, begin_date: ymd(new Date(Date.now() - 86400e3)),
      range: 312, datum: "MLLW", units: "english", time_zone: "lst_ldt", format: "json", application: "casey_app" };
    const none = { predictions: [] };
    const [curve, hilo, w] = await Promise.all([
      L.station ? getJSON(noaa, { ...q, interval: "30" }) : none,
      L.station ? getJSON(noaa, { ...q, interval: "hilo" }) : none,
      getJSON("https://api.open-meteo.com/v1/forecast", {
        latitude: L.lat, longitude: L.lon,
        hourly: "temperature_2m,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m,is_day,precipitation_probability",
        daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",
        wind_speed_unit: "mph", temperature_unit: "fahrenheit", timezone: "America/Chicago",
        past_days: 1, forecast_days: 11 })]);
    const waves = new Map(), water = new Map();
    if (L.sea) try {  // wave forecast only goes about 7 days out
      const r = await getJSON("https://marine-api.open-meteo.com/v1/marine", {
        latitude: L.sea[0], longitude: L.sea[1], hourly: "wave_height,wave_period,sea_surface_temperature",
        timezone: "America/Chicago", past_days: 1, forecast_days: 8 });
      const m = r.hourly, inF = /F/.test((r.hourly_units || {}).sea_surface_temperature || "");
      m.time.forEach((t, i) => {
        const h = m.wave_height[i], p = m.wave_period[i], c = (m.sea_surface_temperature || [])[i];
        if (h != null && p != null) waves.set(t, [h * 3.281, p]);  // meters -> feet
        if (c != null) water.set(t, inF ? c : c * 9 / 5 + 32);     // Celsius -> Fahrenheit
      });
    } catch (e) {}
    let buoy = null;
    if (L.buoy) try { buoy = readBuoy(await getJSON(BUOY_API, { site: L.buoy, v: 2 })   /* v: skip responses cached before the water temp backup */); } catch (e) { buoy = { error: true }; }
    if (my !== loading) return;
    state.data = {
      curve: curve.predictions.map(p => [parse(p.t), +p.v]),
      hilo: hilo.predictions.map(p => [parse(p.t), +p.v, p.type]),
      w, waves, water, buoy };
    state.updated = new Date();
    state.error = "";
    ok = true;
  } catch (e) {
    if (my !== loading) return;
    state.error = `Update failed ${hm(new Date())}, retrying`;
    setTimeout(load, 120e3);
  }
  const old = ok && on("aWipe") ? snapshot() : null;   // wave washes the new data in
  draw();
  if (old) play("wipe", { old });
  if (ok) FX.tideFlood = performance.now();
}

// latest buoy reading -> { time, live, waveFt, period, waterF }; live = reported in the last 3 hours
// lake = backup water temp (LakeMonster) for when the buoy is out
function readBuoy(j) {
  const lake = j && j.lake && j.lake.waterF != null ? j.lake : null;
  if (!j || !j.time) return { error: true, lake };
  const r = j.readings || {}, val = k => (r[k] || {}).value;
  const time = new Date(j.time), hs = val("Hs Wave Height"), wt = val("Water Temperature at surface");
  return { time, lake, live: Date.now() - time < 3 * 3600e3,
           waveFt: hs == null ? null : (r["Hs Wave Height"].unit === "m" ? hs * 3.281 : hs),
           period: val("Tp (DPD) Wave Period"), waterF: wt };
}

// ---------- drawing ----------
const cv = document.getElementById("c");
let ctx = cv.getContext("2d");   // swapped to the animation layers while they draw
const mainCtx = ctx;

function setFont(size, bold) { ctx.font = `${bold ? "bold " : ""}${size}px system-ui, Roboto, sans-serif`; }
function text(s, x, y, size, color, ax = .5, bold = false) {
  setFont(size, bold);
  ctx.fillStyle = rgba(color || T.text);
  ctx.textBaseline = "middle";
  const w = ctx.measureText(s).width;
  ctx.fillText(s, x - w * ax, y);
  return w;
}
function fit(s, size, maxW, bold) {  // largest font size (down to 70%) that fits in maxW
  setFont(size, bold);
  const w = ctx.measureText(s).width;
  return w <= maxW ? size : Math.max(size * .7, size * maxW / w);
}
function line(pts, color, width = 1, dash) {
  ctx.strokeStyle = rgba(color); ctx.lineWidth = width; ctx.setLineDash(dash || []);
  ctx.beginPath();
  for (let i = 0; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i+1]);
  ctx.stroke(); ctx.setLineDash([]);
}
function area(pts, base, color) {

  for (let i = 0; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i+1]);

}
function rect(x, y, w, h, color) { ctx.fillStyle = rgba(color); ctx.fillRect(x, y, w, h); }
function dot(x, y, r, color) { ctx.fillStyle = rgba(color); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }

function arrow(cx, cy, deg, size, color) {
  const a = (deg + 180) * Math.PI / 180;  // direction the wind blows toward
  const dx = Math.sin(a), dy = -Math.cos(a);
  const x1 = cx + dx * size / 2, y1 = cy + dy * size / 2;
  ctx.strokeStyle = rgba(color); ctx.lineWidth = Math.max(1.5, size / 14); ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(cx - dx * size / 2, cy - dy * size / 2); ctx.lineTo(x1, y1);

}

// ---------- weather icons (drawn, so they look the same on every device) ----------
function wxKind(code) {
  if (code >= 95) return "storm";
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return "snow";
  if (code >= 80) return "showers";
  if (code >= 61) return "rain";
  if (code >= 51) return "drizzle";
  if (code >= 45) return "fog";
  return ["sun", "mostly", "partly", "cloud"][code] || "cloud";
}
function sun(cx, cy, r) {
  const c = rgba([.99, .78, .2, 1]);
  ctx.strokeStyle = c; ctx.lineWidth = Math.max(1.5, r * .22); ctx.lineCap = "round";
  ctx.beginPath();
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4;
    ctx.moveTo(cx + Math.cos(a) * r * 1.35, cy + Math.sin(a) * r * 1.35);
    ctx.lineTo(cx + Math.cos(a) * r * 1.8, cy + Math.sin(a) * r * 1.8);
  }
  ctx.stroke(); ctx.lineCap = "butt";
  ctx.fillStyle = c; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
}
function cloud(cx, cy, w, dark) {  // w = width; centred on cx, cy
  const h = w * .55, b = cy + h / 2;
  ctx.fillStyle = rgba(dark ? (state.light ? [.45,.5,.58,1] : [.62,.67,.75,1])
                            : (state.light ? [.7,.74,.8,1] : [.88,.9,.94,1]));
  ctx.beginPath();
  ctx.arc(cx - w * .24, b - h * .3, h * .3, 0, 7);
  ctx.arc(cx + w * .02, b - h * .52, h * .45, 0, 7);
  ctx.arc(cx + w * .25, b - h * .33, h * .33, 0, 7);
  ctx.rect(cx - w * .24, b - h * .3, w * .49, h * .3);   // one shape, so see-through clouds shade evenly
  ctx.fill();
}
function wxIcon(code, cx, cy, s) {  // s = icon height
  const k = wxKind(code);
  if (k === "sun") return sun(cx, cy, s * .27);
  if (k === "mostly") { sun(cx - s * .12, cy - s * .08, s * .24); return cloud(cx + s * .22, cy + s * .18, s * .62); }
  if (k === "partly") { sun(cx - s * .2, cy - s * .15, s * .22); return cloud(cx + s * .08, cy + s * .08, s * .95); }
  if (k === "showers") sun(cx - s * .28, cy - s * .25, s * .18);
  const wet = k !== "cloud" && k !== "fog";
  if (k === "snow") {
    cloud(cx, cy - s * .14, s * 1.05, true);
    for (const [dx, dy] of [[-.25, .26], [0, .38], [.25, .26]]) dot(cx + dx * s, cy + dy * s, Math.max(1.5, s * .065), T.rain);
    return;
  }
  cloud(cx, wet ? cy - s * .14 : cy, s * 1.05, wet);
  const top = cy + s * .16;
  if (k === "fog") {
    line([cx - s * .45, cy + s * .32, cx + s * .45, cy + s * .32], T.gray, Math.max(1.5, s * .07));
    line([cx - s * .35, cy + s * .46, cx + s * .35, cy + s * .46], T.gray, Math.max(1.5, s * .07));
  } else if (k === "drizzle") {
    for (const dx of [-.25, 0, .25]) dot(cx + dx * s, top + s * .2, Math.max(1.3, s * .05), T.rain);
  } else if (k === "rain" || k === "showers") {
    ctx.lineCap = "round";
    for (const dx of [-.25, 0, .25]) line([cx + dx * s, top + s * .06, cx + dx * s - s * .08, top + s * .32], T.rain, Math.max(1.5, s * .08));
    ctx.lineCap = "butt";
  } else if (k === "storm") {
    ctx.fillStyle = rgba([.99, .78, .2, 1]); ctx.beginPath();
    for (const [x, y] of [[.06,0], [-.14,.24], [0,.24], [-.08,.42], [.16,.14], [.02,.14], [.1,0]]) ctx.lineTo(cx + x * s, top + y * s);
    ctx.closePath(); ctx.fill();
  }
}

// name of a day with its weather icon on the left and moon on the right, fitted to the column
function dayTitle(name, mid, y, size, maxW, d, code, iconS, moonR) {
  const ic = state.showWx && code != null ? iconS * 1.4 : 0, mn = state.showMoon ? moonR * 2 + size * .35 : 0;
  const ns = fit(name, size, maxW - ic - mn, true);
  setFont(ns, true);
  const nw = ctx.measureText(name).width, x0 = mid - (ic + nw + mn) / 2;
  if (ic) wxIcon(code, x0 + iconS * .65, y + iconS * .04, iconS);  // icon's art reaches ~.6 left of centre
  text(name, x0 + ic, y, ns, T.text, 0, true);
  if (mn) moon(x0 + ic + nw + size * .35 + moonR, y, moonR, moonAge(d));
}

function moon(cx, cy, r, age) {
  dot(cx, cy, r, T.moon_dark);
  const k = Math.cos(2 * Math.PI * age), side = age < .5 ? 1 : -1;  // lit on the right while waxing
  ctx.beginPath();
  for (let s = 0; s <= 24; s++) { const y = -r + 2*r*s/24; ctx.lineTo(cx + side * Math.sqrt(Math.max(r*r - y*y, 0)), cy + y); }
  for (let s = 24; s >= 0; s--) { const y = -r + 2*r*s/24; ctx.lineTo(cx + side * k * Math.sqrt(Math.max(r*r - y*y, 0)), cy + y); }
  ctx.closePath(); ctx.fillStyle = rgba(T.moon); ctx.fill();
}

function texasFlag(x, cy, h) {
  const w = h * 1.5, y = cy - h / 2;
  ctx.fillStyle = "#fff"; ctx.fillRect(x, y, w, h / 2);
  ctx.fillStyle = "#bf0a30"; ctx.fillRect(x, y + h / 2, w, h / 2);
  ctx.fillStyle = "#002868"; ctx.fillRect(x, y, w / 3, h);
  const sx = x + w / 6, r = h * .3;
  ctx.beginPath();
  for (let k = 0; k < 10; k++) {
    const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .4 : r;
    ctx.lineTo(sx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fillStyle = "#fff"; ctx.fill();
  if (state.light) { ctx.strokeStyle = rgba(T.sep); ctx.lineWidth = 1; ctx.strokeRect(x, y, w, h); }
}

function iowaFlag(x, cy, h) {
  const w = h * 1.5, y = cy - h / 2;
  ctx.fillStyle = "#002868"; ctx.fillRect(x, y, w / 3, h);
  ctx.fillStyle = "#fff"; ctx.fillRect(x + w / 3, y, w / 3, h);
  ctx.fillStyle = "#bf0a30"; ctx.fillRect(x + w * 2 / 3, y, w / 3, h);
  ctx.fillStyle = "#1f3a7a"; ctx.beginPath();   // little eagle-ish wings on the white stripe
  ctx.ellipse(x + w / 2, cy - h * .08, w * .14, h * .12, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = "#bf0a30"; ctx.font = `bold ${h * .2}px system-ui, sans-serif`; ctx.textBaseline = "middle";
  const tw = ctx.measureText("IOWA").width; ctx.fillText("IOWA", x + w / 2 - tw / 2, cy + h * .25);
  if (state.light) { ctx.strokeStyle = rgba(T.sep); ctx.lineWidth = 1; ctx.strokeRect(x, y, w, h); }
}
function caret(cx, cy, s, color) {   // small "v" that says the title opens a menu
  ctx.strokeStyle = rgba(color); ctx.lineWidth = Math.max(2, s * .22); ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(cx - s * .5, cy - s * .25); ctx.lineTo(cx, cy + s * .25); ctx.lineTo(cx + s * .5, cy - s * .25);
  ctx.stroke(); ctx.lineCap = "butt"; ctx.lineJoin = "miter";
}

let titleBox = null;   // where the place name is drawn, for tapping
const SCALE = { s: .88, m: 1, l: 1.14 };
function draw() {
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  const pw = Math.round(W * dpr), ph = Math.round(H * dpr);
  if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; }
  ctx = mainCtx; G = null;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (state.anim) ctx.clearRect(0, 0, W, H);   // see-through, so the background animation layer shows
  else rect(0, 0, W, H, T.bg);
  const f = Math.min(H / 46, W / 76) * (SCALE[state.textSize] || 1), now = new Date(), top = f * 2.1;
  const ps = fit(LOC.name, f * 1.5, W * .3, true);
  const tw = text(LOC.name, f * 1.2, top, ps, T.text, 0, true);
  (LOC.flag === "iowa" ? iowaFlag : texasFlag)(f * 1.9 + tw, top, ps * .95);
  const cx0 = f * 1.9 + tw + ps * 1.45 + ps * .65;
  caret(cx0, top, ps * .55, T.gray);
  const placeEnd = cx0 + ps * .45;
  titleBox = { x: f * .4, y: top - ps * .9, w: placeEnd - f * .4 + f * .4, h: ps * 1.8 };
  placeHint();

  const old = !state.updated || now - state.updated > STALE_MIN * 60e3;
  const upd = document.getElementById("upd");
  upd.textContent = state.error || (state.updated ? `Updated ${hm(state.updated)}` : "Loading...");
  upd.classList.toggle("old", !!(old || state.error));
  if (state.data) chart(W, H, f, now, top, placeEnd);
  fxKick();
}

function chart(W, H, f, now, top, placeEnd) {
  const { curve, hilo, w, waves, water, buoy } = state.data, hr = w.hourly, dy = w.daily;
  const times = hr.time.map(parse);
  const t0 = new Date(now); t0.setMinutes(0, 0, 0);
  const ts = state.past ? new Date(t0 - 24 * 3600e3) : t0;   // chart start
  const t1 = state.days === 1 ? new Date(+t0 + 24 * 3600e3) : addDays(t0, state.days + 1);
  const inow = hr.time.indexOf(hourKey(t0)), i0 = hr.time.indexOf(hourKey(ts));
  if (inow < 0 || i0 < 0) { text("Waiting for new data...", W / 2, H / 2, f, T.gray); return; }
  const n = Math.round((t1 - ts) / 3600e3);
  const idx = []; for (let k = 0; k < n && i0 + k < times.length; k++) idx.push(i0 + k);
  const spd = hr.wind_speed_10m, gst = hr.wind_gusts_10m, dirs = hr.wind_direction_10m;
  const rainP = hr.precipitation_probability;

  const L = f * 3.4, R = W - f * 3.2, pw = R - L, bw = pw / n, span = t1 - ts;
  const xt = t => L + (t - ts) / span * pw;
  const hourly = n <= 50;                           // 24 hour view: show every hour
  const step = n <= 30 ? 1 : n <= 50 ? 2 : n <= 100 ? 3 : n <= 170 ? 6 : 12;   // arrow spacing in hours

  // ---- current conditions in header ----
  const s0 = spd[inow], wc = windColor(s0);
  const mph = `${Math.round(num("spd", s0))} mph`;
  let extra = `gusts ${Math.round(num("gst", gst[inow]))}   ${compass(dirs[inow])}   ${Math.round(num("temp", hr.temperature_2m[inow]))}°F`;
  let wv0 = waves.get(hr.time[inow]), wt0 = water.get(hr.time[inow]);
  if (buoy && buoy.live) {
    if (buoy.waveFt != null && buoy.period != null) wv0 = [buoy.waveFt, buoy.period];
    if (buoy.waterF != null) wt0 = buoy.waterF;
  }
  if (buoy && wt0 == null && buoy.lake) wt0 = buoy.lake.waterF;
  if (wv0) extra += `   waves ${num("wave", wv0[0]).toFixed(1)} ft @ ${Math.round(num("per", wv0[1]))}s`;
  if (wt0 != null) extra += `   water ${Math.round(num("water", wt0))}°F`;
  const mphW = (setFont(f * 2.3, true), ctx.measureText(mph).width);
  let es = f * 1.45;
  setFont(es); let ew = ctx.measureText(extra).width;
  const need = () => f * 3.6 + mphW + f * 1.2 + ew;
  let cx = Math.max(W * .36, placeEnd + f * 1.5);
  if (cx + need() > W - f * 1.2) cx = Math.max(placeEnd + f * 1.5, W - f * 1.2 - need());
  if (cx + need() > W - f * 1.2) { es = fit(extra, es, W - f * 1.2 - cx - f * 4.8 - mphW, false); setFont(es); ew = ctx.measureText(extra).width; }
  const wobble = on("aNums");   // the animation layer draws the arrow so it can wobble
  if (!wobble) arrow(cx + f, top, dirs[inow], f * 1.9, wc);
  let x = cx + f * 2.4;
  x += text(mph, x, top, f * 2.3, wc, 0, true) + f * 1.2;
  text(extra, x, top, es, T.text, 0);

  // ---- vertical layout ----
  const fullCol = 86400e3 / span * pw;
  const mode = fullCol > pw * .18 ? "wide" : fullCol > pw * .07 ? "mid" : "narrow";
  const rh = f * 1.5, rows = mode === "wide" ? 3 : mode === "mid" ? 4 : 1;
  const h0 = state.showWx ? rh * 1.4 : rh;  // taller name row so weather icons don't touch the next line
  const dayTop = top + f * 2.2, dayBot = dayTop + h0 + (rows - 1) * rh;
  const rowY = r => r ? dayTop + h0 + rh * (r - .5) : dayTop + h0 / 2;
  const arrowY = dayBot + f * 1.1, pctY = arrowY + f * 1.35, tempY = pctY + f * 1.2;
  const pBot = H - f * 1.7, gap = f * 2.1;  // room for hour labels and panel titles
  const panels = [["wind", 1.3]];
  if (state.showTides && LOC.station) panels.push(["tide", 1]);   // lakes have no tides
  const buoyOut = buoy && !(buoy.live && (buoy.waveFt != null || buoy.waterF != null));
  if (state.showWaves) panels.push(["wave", buoyOut ? .22 : buoy ? .4 : 1]);   // buoy out: short strip
  let y = (hourly ? tempY : pctY) + f * .9;
  const totW = panels.reduce((a, p) => a + p[1], 0), avail = pBot - y - gap * panels.length;
  const box = {};
  for (const [name, wgt] of panels) { y += gap; box[name] = [y, y + avail * wgt / totW]; y = box[name][1]; }
  const [wt, wb] = box.wind;
  const code = (hr.weather_code || [])[inow];
  G = { W, H, f, L, R, wt, wb, top, pBot, dayBot, spd: s0, gst: gst[inow], dir: dirs[inow],
        temp: hr.temperature_2m[inow], code: code == null ? dy.weather_code[dy.time.indexOf(isoDate(now))] : code,
        isDay: hr.is_day[inow], wave: wv0, lakeCalm: !!buoy && !wv0, tide: null,
        arrow: wobble ? { x: cx + f, y: top, size: f * 1.9, color: wc } : null };

  // day / night shading
  for (let k = 0; k < idx.length;) {
    const isDay = hr.is_day[idx[k]];
    let e = k; while (e < idx.length && hr.is_day[idx[e]] === isDay) e++;
    rect(L + k * bw, wt, (e - k) * bw, pBot - wt, isDay ? T.day : T.night);
    k = e;
  }

  // day columns with forecast and moon
  const today = midnight(now);
  for (let d = midnight(ts); d < t1; d = addDays(d, 1)) {
    const a = new Date(Math.max(ts, d)), b = new Date(Math.min(t1, addDays(d, 1)));
    const xa = xt(a), xb = xt(b), mid = (xa + xb) / 2, colw = xb - xa, cw = colw * .92;
    if (a > ts) line([xa, pBot, xa, dayTop - f * .3], T.sep, 1);
    const j = dy.time.indexOf(isoDate(d));
    if (j < 0) continue;
    const pp = dy.precipitation_probability_max[j] || 0;
    const cond = WMO[dy.weather_code[j]] || "";
    const temps = `${Math.round(dy.temperature_2m_max[j])}° / ${Math.round(dy.temperature_2m_min[j])}°`;
    let name;
    if (d < today) name = "Yesterday";
    else if (+d === +today) name = now.getHours() >= 17 && !state.past ? "Tonight" : "Today";
    else name = mode === "wide" ? d.toLocaleDateString("en-US", { weekday: "long" })
                                : `${d.toLocaleDateString("en-US", { weekday: "short" })} ${d.getDate()}`;
    const rain = `rain ${Math.round(pp)}%`;
    if (mode === "wide" && colw > pw * .12) {
      dayTitle(name, mid, rowY(0), f * 1.45, colw - f * 1.2, d, dy.weather_code[j], f * 1.8, f * .75);
      text(cond, mid, rowY(1), fit(cond, f * 1.2, cw), T.gray);
      const tr = `${temps}    ${rain}`;
      text(tr, mid, rowY(2), fit(tr, f * 1.2, cw));
    } else if (mode !== "narrow" && colw > fullCol * .55) {
      dayTitle(name, mid, rowY(0), f * 1.2, colw - f * .8, d, dy.weather_code[j], f * 1.6, f * .6);
      text(cond, mid, rowY(1), fit(cond, f * 1.05, cw), T.gray);
      text(temps, mid, rowY(2), fit(temps, f * 1.1, cw));
      text(rain, mid, rowY(3), fit(rain, f * 1.05, cw), pp >= 30 ? T.rain : T.gray);
    } else if (colw > f * 2.5) {
      const nm = mode === "narrow" ? name.slice(0, 3) : name.split(" ")[0];
      text(nm, mid, rowY(0), fit(nm, f * 1.05, cw, true), T.text, .5, true);
    }
  }

  // panel titles
  const title = (s, x, yb, color, ax = 0) => text(s, x, yb - f * 1.0, f * 1.05, color, ax);

  // ---- wind chart ----
  const ymax = Math.max(30, Math.ceil((Math.max(...idx.map(i => gst[i])) + 3) / 10) * 10);
  const wy = v => wb - v / ymax * (wb - wt);
  for (let v = 10; v <= ymax; v += 10) {
    line([L, wy(v), R, wy(v)], T.grid, 1);
    text(String(v), L - f * .5, wy(v), f, T.gray, 1);
  }
  title("wind mph", L, wt, T.gray);
  line([L, wy(KITE), R, wy(KITE)], [...T.kite.slice(0, 3), .6], 1, [6, 6]);
  const gpts = [], best = new Map();
  idx.forEach((i, k) => {
    const xx = L + k * bw;
    rect(xx + bw * .15, wy(spd[i]), bw * .7, wb - wy(spd[i]), windColor(spd[i]));
    gpts.push(xx + bw / 2, wy(gst[i]));
    const key = isoDate(times[i]);
    if (!best.has(key) || spd[i] > best.get(key)[0]) best.set(key, [spd[i], k, i]);
  });
  line(gpts, T.gust, 1.5);
  let lastX = -1e9;
  if (hourly) idx.forEach((i, k) => {     // every hour's speed
    if (k % step) return;
    const px = L + (k + .5) * bw;
    text(String(Math.round(spd[i])), px, wy(Math.max(spd[i], gst[i])) - f * .8, f * (step > 1 ? .9 : 1), windColor(spd[i]), .5, true);
  });
  else for (const [s, k, i] of best.values()) {  // daily peak
    const px = Math.max(L + f * .9, L + (k + .5) * bw);
    if (px - lastX < f * 3) continue;
    text(String(Math.round(s)), px, wy(gst[i]) - f * .8, f * 1.05, windColor(s), .5, true);
    lastX = px;
  }
  idx.forEach((i, k) => {                  // direction arrows with rain chance
    if (k % step !== Math.floor(step / 2)) return;
    const ax = L + (k + .5) * bw, pr = rainP[i] || 0;
    arrow(ax, arrowY, dirs[i], f * 1.45, windColor(spd[i]));
    text(`${Math.round(pr)}%`, ax, pctY, f * .85, pr >= 30 ? T.rain : T.gray, .5, pr >= 30);
    if (hourly) text(`${Math.round(hr.temperature_2m[i])}°`, ax, tempY, f * .9, T.text);
  });
  if (hourly) text("rain / air", L - f * .5, (pctY + tempY) / 2, f * .7, T.gray, 1);

  // ---- tide chart ----
  if (box.tide) {
    const [tt, tb] = box.tide;
    title("tide ft", L, tt, T.tide);
    const pts = curve.filter(([t]) => t >= ts && t <= t1);
    if (pts.length) {
      const vs = pts.map(p => p[1]);
      const lo = Math.floor(Math.min(...vs) * 2) / 2 - .5, hi = Math.ceil(Math.max(...vs) * 2) / 2 + .6;
      const ty = v => tb - (v - lo) / (hi - lo) * (tb - tt);
      for (let v = Math.ceil(lo); v <= Math.floor(hi); v++) {
        line([L, ty(v), R, ty(v)], T.grid, 1);
        text(String(v), L - f * .5, ty(v), f, T.gray, 1);
      }
      const tl = pts.flatMap(([t, v]) => [xt(t), ty(v)]);
      area(tl, tb, T.tide_fill);
      line(tl, T.tide, 2.5);
      const k = curve.findIndex(([t]) => t > now);   // current tide level, for the shimmer animation
      if (k > 0) {
        const [ta, va] = curve[k - 1], [tb2, vb] = curve[k], v = va + (vb - va) * (now - ta) / (tb2 - ta);

      }
      for (const [t, v, typ] of hilo) {

        dot(xx, yy, Math.max(4, f * .3), T.dot);
        const lbl = n <= 170 ? `${short(t)}  ${v.toFixed(1)}` : v.toFixed(1);
        text(lbl, xx, yy + (typ === "H" ? -f * .95 : f * .95), f * (n <= 170 ? .95 : 1));

    ctx.translate(s.mx + dx, s.my + dy); ctx.rotate(s.spin * u); ctx.translate(-s.mx, -s.my);
    ctx.beginPath(); ctx.moveTo(...s.tri[0]); ctx.lineTo(...s.tri[1]); ctx.lineTo(...s.tri[2]); ctx.closePath();
    ctx.save(); ctx.clip(); ctx.drawImage(e.frozen, 0, 0, W, H); ctx.restore();
    ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }
}
function wipe(e, p, sec) {
  const W = cv.clientWidth, H = cv.clientHeight, ww = Math.max(80, W * .08), front = -ww + (W + ww * 2) * ease(p);
  const edge = y => front + Math.sin(y / 45 + sec * 6) * 10 + Math.sin(y / 17) * 4;
  ctx.save(); ctx.beginPath(); ctx.moveTo(W, 0);   // old screen ahead of the wave
  for (let y = 0; y <= H; y += 10) ctx.lineTo(edge(y), y);
  ctx.lineTo(W, H); ctx.closePath(); ctx.clip();
  ctx.drawImage(e.old, 0, 0, W, H); ctx.restore();
  const g = ctx.createLinearGradient(front - ww * 2, 0, front, 0), c = T.wave.slice(0, 3).map(v => Math.round(v * 255)).join(",");
  g.addColorStop(0, `rgba(${c},0)`); g.addColorStop(1, `rgba(${c},.55)`);
  ctx.beginPath(); ctx.moveTo(front - ww * 2, 0);
  for (let y = 0; y <= H; y += 10) ctx.lineTo(edge(y), y);
  ctx.lineTo(front - ww * 2, H); ctx.closePath(); ctx.fillStyle = g; ctx.fill();
  for (let y = 0; y <= H; y += 13) dot(edge(y) + Math.sin(y * 7) * 4, y, 2 + (Math.sin(y * 3.1 + sec * 8) + 1) * 1.3, [1, 1, 1, .8]);   // foam
}


// ---- haywire forecast: the numbers drift slowly, then faster and faster, for 30 s until they're absurd;
// the screen shakes and blows up, stays black 1 s, and the wave wipe brings the real data back ----
function haywire(d, k, seed) {   // a wild copy of the data; k goes 0 -> 1. The real data is never changed.
  const h = i => { const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453; return x - Math.floor(x); };
  const codes = [0, 3, 45, 63, 75, 95], hr = d.w.hourly, dy = d.w.daily;
  const tide = (t, v) => v * (1 + 12 * k) + k * 15 * Math.sin(t / 3600e3 * 1.3 + seed);
  const spd = hr.wind_speed_10m.map((v, i) => Math.max(0, v * (1 + 14 * k) + (h(i) - .3) * k * 260));
  return {
    curve: d.curve.map(([t, v]) => [t, tide(t, v)]),
    hilo: d.hilo.map(([t, v, typ]) => [t, tide(t, v), typ]),
    w: { hourly: { ...hr,
           wind_speed_10m: spd,
           wind_gusts_10m: hr.wind_gusts_10m.map((g, i) => spd[i] + Math.max(0, g - hr.wind_speed_10m[i]) * (1 + 10 * k) + h(i + 7) * k * 120),
           wind_direction_10m: hr.wind_direction_10m.map((v, i) => v + k * 720 * h(i + 3)),
           temperature_2m: hr.temperature_2m.map((v, i) => v * (1 + 2 * k) + k * (500 + 500 * h(i + 11))),
           precipitation_probability: hr.precipitation_probability.map((v, i) => (v || 0) + k * 900 * h(i + 5)),
           is_day: hr.is_day.map((v, i) => h(i + 9) < k - .5 ? 1 - v : v),
           weather_code: (hr.weather_code || []).map((v, i) => h(i + 13) < k ? codes[Math.floor(h(i + 17) * 6)] : v) },
         daily: { ...dy,
           temperature_2m_max: dy.temperature_2m_max.map((v, i) => v + k * 900 * h(i + 21)),
           temperature_2m_min: dy.temperature_2m_min.map((v, i) => v - k * 300 * h(i + 23)),
           precipitation_probability_max: dy.precipitation_probability_max.map((v, i) => (v || 0) + k * 900 * h(i + 25)),
           weather_code: dy.weather_code.map((v, i) => h(i + 27) < k ? codes[Math.floor(h(i + 29) * 6)] : v) } },
    waves: new Map([...d.waves].map(([t, [ht, p]], i) => [t, [ht * (1 + 30 * k) + k * 60 * h(i + 31), p * (1 + 8 * k)]])),
    water: new Map([...d.water].map(([t, v], i) => [t, v + k * 700 * h(i + 33)])),
    buoy: d.buoy && { ...d.buoy, waveFt: d.buoy.waveFt == null ? null : d.buoy.waveFt * (1 + 40 * k),
                      period: d.buoy.period == null ? null : d.buoy.period * (1 + 8 * k),
                      waterF: d.buoy.waterF == null ? null : d.buoy.waterF + k * 700,
                      lake: d.buoy.lake && { ...d.buoy.lake, waterF: d.buoy.lake.waterF + k * 700 } } };
}
function chaos(e, now) {
  const W = cv.clientWidth, H = cv.clientHeight, t = (now - e.t0) / 1000;
  if (e.wiped) return;
  if (t < 30) {
    const k = (t / 30) ** 3;   // starts slow, keeps speeding up
    if (state.data && (e.n = (e.n || 0) + 1) % 2) {   // redraw the chart with wild numbers (15 times a second)
      const real = state.data;
      state.data = haywire(real, k, e.seed); FX.chaos = true;
      try { draw(); } finally { state.data = real; FX.chaos = false; ctx = fctx; }
    }
    const a = t > 26 ? (t - 26) / 4 * 14 : 0;   // shakes harder and harder just before it blows
    cv.style.transform = a ? `translate(${rnd(-a, a)}px,${rnd(-a, a)}px) rotate(${rnd(-a, a) * .05}deg)` : "";
    return;
  }
  if (!e.snap) {   // boom: break up the wild screen, and quietly put the real data back underneath
    e.snap = snapshot(); cv.style.transform = ""; draw(); ctx = fctx;
    const nx = 10, ny = 7, P = [], cx = W / 2, cy = H / 2;
    for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++)
      P.push([W * i / nx + (i % nx ? rnd(-.3, .3) * W / nx : 0), H * j / ny + (j % ny ? rnd(-.3, .3) * H / ny : 0)]);
    e.shards = [];
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
      const a = P[j * (nx + 1) + i], b = P[j * (nx + 1) + i + 1], c = P[(j + 1) * (nx + 1) + i + 1], d = P[(j + 1) * (nx + 1) + i];
      for (const tri of [[a, b, c], [a, c, d]]) {
        const mx = (tri[0][0] + tri[1][0] + tri[2][0]) / 3, my = (tri[0][1] + tri[1][1] + tri[2][1]) / 3;
        const dx = mx - cx, dy = my - cy, dist = Math.hypot(dx, dy) || 1, v = rnd(500, 1300);
        e.shards.push({ tri, mx, my, vx: dx / dist * v, vy: dy / dist * v, spin: rnd(-8, 8) });
      }
    }
    e.sparks = Array.from({ length: 90 }, () => { const a = rnd(0, 7), v = rnd(200, 1100); return [Math.cos(a) * v, Math.sin(a) * v, rnd(.3, 1)]; });
    e.black = document.createElement("canvas"); e.black.width = cv.width; e.black.height = cv.height;
    e.black.getContext("2d").fillRect(0, 0, cv.width, cv.height);
  }
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, innerWidth, innerHeight);
  const u = t - 30, R = Math.hypot(W, H) / 2;
  if (u < 1.2) {
    for (const s of e.shards) {   // pieces fly out
      const x = s.vx * u, y = s.vy * u + 300 * u * u;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - u / 1.1);
      ctx.translate(s.mx + x, s.my + y); ctx.rotate(s.spin * u); ctx.translate(-s.mx, -s.my);
      ctx.beginPath(); ctx.moveTo(...s.tri[0]); ctx.lineTo(...s.tri[1]); ctx.lineTo(...s.tri[2]); ctx.closePath(); ctx.clip();
      ctx.drawImage(e.snap, 0, 0, W, H); ctx.restore();
    }
    const r = R * (.15 + 1.4 * Math.sqrt(u / 1.2)), al = Math.max(0, 1 - u / 1.2);   // fireball
    const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, r);
    g.addColorStop(0, `rgba(255,255,240,${al})`); g.addColorStop(.25, `rgba(255,220,90,${al * .95})`);
    g.addColorStop(.6, `rgba(255,110,30,${al * .7})`); g.addColorStop(1, "rgba(120,20,0,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, innerWidth, innerHeight);
    if (u < .12) { ctx.fillStyle = `rgba(255,255,255,${1 - u / .12})`; ctx.fillRect(0, 0, innerWidth, innerHeight); }   // flash
    for (const [vx, vy, life] of e.sparks) if (u < life) {
      const q = u / life;
      dot(W / 2 + vx * u, H / 2 + vy * u + 200 * u * u, 2.5 * (1 - q) + .5, [1, .75 + .25 * (1 - q), .3, 1 - q]);
    }
  }
  if (t >= 32.2 && !e.wiped) { e.wiped = 1; play("wipe", { old: e.black }); }   // after 1 s of black, the wave brings it back
}
// ---- frame loop ----
let fxRaf = 0, fxPrev = 0;
function fxKick() { if (!fxRaf && document.visibilityState !== "hidden") fxRaf = requestAnimationFrame(fxFrame); }
function fxFrame(now) {
  fxRaf = 0;
  if (now - fxPrev < 30) { fxKick(); return; }   // about 30 frames a second is plenty
  const dt = Math.min(.1, (now - fxPrev) / 1000), sec = now / 1000; fxPrev = now;
  if (now < numUntil) draw();
  fxSchedule(now);
  const dpr = window.devicePixelRatio || 1, S = { w: innerWidth, h: innerHeight };
  for (const c of [fxb, fxf]) {
    const w = Math.round(S.w * dpr), h = Math.round(S.h * dpr);
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
    const x = c.getContext("2d"); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, S.w, S.h);
  }
  const P = bandParams(S);
  let busy = now < numUntil;
  ctx = bctx;
  if (G && on("aWx")) busy = wxBack(dt, sec) || busy;
  if (G && on("aWind")) busy = streaks(dt, sec) || busy;
  if (on("aWaves")) { waveBand(sec, S, P); busy = true; }
  ctx = fctx;
  if (G) {
    if (on("aWx")) busy = wxFront(dt, now) || busy;
    if (on("aTide") && G.tide && state.showTides) { tideShimmer(sec, now); busy = true; }
  }
  if (G && G.arrow) {   // header wind arrow, swaying more when it's gusty
    const a = G.arrow, g = Math.max(0, G.gst - G.spd), amp = Math.min(20, 2 + g * 1.2);
    arrow(a.x, a.y, G.dir + amp * (Math.sin(sec * 2.1) * .6 + Math.sin(sec * 5.3 + 1) * .4 * clamp(g / 10, 0, 1)), a.size, a.color);
    busy = true;
  }
  FX.events = FX.events.filter(e => now - e.t0 < e.dur);
  const order = { kite: 0, life: 0, bite: 0, ren: 0, sub: 0, wipe: 1, melt: 2, freeze: 2, chaos: 2 };   // melt and freeze cover everything else
  for (const e of [...FX.events].sort((a, b) => order[a.kind] - order[b.kind])) {
    const p = (now - e.t0) / e.dur;
    if (e.kind === "kite") kiteboarder(e, p, sec, P);
    if (e.kind === "life") { e.way === "jump" ? jump(e, p, sec, P, now) : cameo(e, p, sec, P, now); busy = splashes(now) || busy; }
    if (e.kind === "sub") submarine(e, now, dt, sec, P);
    if (e.kind === "ren") { ren(e, now, dt, sec, P); busy = splashes(now) || busy; }
    if (e.kind === "bite") { bite(e, now, sec, P); busy = splashes(now) || busy; }
    if (e.kind === "wipe") wipe(e, p, sec);
    if (e.kind === "melt") melt(e, now);
    if (e.kind === "freeze") freeze(e, now);
    if (e.kind === "chaos") chaos(e, now);
    busy = true;
  }
  if (!FX.events.some(e => e.kind === "life" || e.kind === "bite" || e.kind === "ren")) busy = splashes(now) || busy;
  ctx = mainCtx;
  if (busy) fxKick();
}
setInterval(fxKick, 10e3);   // checks the timers for the occasional animations

function applyTheme() {
  T = state.light ? LIGHT : DARK;
  const s = document.documentElement.style;
  s.setProperty("--bg", rgba(T.bg)); s.setProperty("--btn", rgba(T.btn));
  s.setProperty("--btntext", rgba(T.btntext)); s.setProperty("--on", rgba(T.kite));
  s.setProperty("--gray", rgba(T.gray)); s.setProperty("--red", rgba(T.red));
  document.querySelector('meta[name="theme-color"]').content = rgba(T.bg);
  document.getElementById("past").classList.toggle("on", state.past);
  bar.querySelectorAll("[data-days]").forEach(b => b.classList.toggle("on", +b.dataset.days === state.days));
  dlg.querySelectorAll("[data-set]").forEach(c => c.checked = !!state[c.dataset.set]);
  const lake = !LOC.station, tc = dlg.querySelector('[data-set="showTides"]');   // lakes: tides off and greyed out
  tc.disabled = lake; if (lake) tc.checked = false;
  document.getElementById("tiderow").classList.toggle("off", lake);
  document.getElementById("tidenote").hidden = !lake;
  dlg.querySelectorAll(".row.sub").forEach(r => {   // animation switches follow the main Animations switch
    const c = r.querySelector(".sw"), off = !state.anim || (r.id === "tidefxrow" && (lake || !state.showTides));
    c.disabled = off; r.classList.toggle("off", off);
  });
  document.getElementById("coldF").textContent = LOC.cold;
  document.getElementById("lifenames").textContent = LIFE_NAMES[state.loc] + ". Every 10 to 15 min; ▶ shows the next one";
  document.getElementById("bitename").textContent = lake ? "Muskie bite" : "Shark bite";
  dlg.querySelectorAll("[data-size]").forEach(b => b.classList.toggle("on", b.dataset.size === state.textSize));
  dlg.querySelectorAll("[data-loc]").forEach(b => b.classList.toggle("on", b.dataset.loc === state.loc));
}
function changed() { save(); applyTheme(); draw(); }

const menu = document.getElementById("locmenu"), hint = document.getElementById("hint");
function setLoc(k) {
  menu.hidden = true;
  if (k === state.loc || !(k in LOCS)) return;
  state.loc = k; LOC = LOCS[k];
  state.data = null; state.updated = null; state.error = "";
  document.title = `${LOC.short} Wind${LOC.station ? " & Tides" : ""}`;
  changed(); load();
}
function openMenu() {
  state.hintSeen = true; save(); hint.hidden = true;
  menu.innerHTML = Object.entries(LOCS).map(([k, l]) =>
    `<button data-loc="${k}" role="menuitem"><span class="ck">${k === state.loc ? "✓" : ""}</span><span>${l.name}<small>${l.sub}</small></span></button>`).join("");
  const r = cv.getBoundingClientRect();
  menu.style.left = `${r.left + titleBox.x}px`; menu.style.top = `${r.top + titleBox.y + titleBox.h + 4}px`;
  menu.hidden = false;
}
function placeHint() {   // first-time bubble pointing at the place name
  if (state.hintSeen || !titleBox) { hint.hidden = true; return; }
  const r = cv.getBoundingClientRect();
  hint.style.left = `${r.left + titleBox.x + 4}px`; hint.style.top = `${r.top + titleBox.y + titleBox.h + 8}px`;
  hint.hidden = false;
}
const inTitle = e => {
  if (!titleBox) return false;
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  return x >= titleBox.x && x <= titleBox.x + titleBox.w && y >= titleBox.y && y <= titleBox.y + titleBox.h;
};
cv.addEventListener("click", e => { if (inTitle(e)) menu.hidden ? openMenu() : (menu.hidden = true); else menu.hidden = true; });
cv.addEventListener("mousemove", e => cv.style.cursor = inTitle(e) ? "pointer" : "");
hint.addEventListener("click", openMenu);
menu.addEventListener("click", e => { const b = e.target.closest("[data-loc]"); if (b) setLoc(b.dataset.loc); });
bar.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "gear") { dlg.hidden = false; return; }
  if (b.id === "past") state.past = !state.past;
  else state.days = +b.dataset.days;
  changed();
});
dlg.addEventListener("change", e => {
  const c = e.target.closest("[data-set]"); if (!c) return;
  state[c.dataset.set] = c.checked; changed();
});
dlg.addEventListener("click", e => {
  if (e.target === dlg || e.target.id === "done") { dlg.hidden = true; return; }
  const t = e.target.closest("[data-try]");
  if (t) { e.preventDefault(); dlg.hidden = true; play(t.dataset.try); return; }
  const b = e.target.closest("[data-size]");
  if (b) { state.textSize = b.dataset.size; changed(); }
  const l = e.target.closest("[data-loc]");
  if (l) setLoc(l.dataset.loc);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") dlg.hidden = menu.hidden = true; });

let wakeLock = null;  // keep the screen on while this page is showing
async function keepAwake() {
  try { if ("wakeLock" in navigator && document.visibilityState === "visible") wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    keepAwake(); fxKick();
    if (!state.updated || Date.now() - state.updated > 10 * 60e3) load();
  }
});

window.addEventListener("resize", draw);
document.title = `${LOC.short} Wind${LOC.station ? " & Tides" : ""}`;
applyTheme();
draw();
load();
keepAwake();
setInterval(load, 15 * 60e3);   // new data every 15 min
setInterval(draw, 60e3);        // move "now" line each minute
</script>
</body>
